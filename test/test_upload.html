<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Upload - GuardiHack</title>
    <style>
        body { font-family: sans-serif; background: #1e1e2e; color: #cdd6f4; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: #313244; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; color: #a6e3a1; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #45475a; background: #11111b; color: #cdd6f4; }
        button { background: #a6e3a1; color: #11111b; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #94e2d5; }
        #response { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; white-space: pre-wrap; font-family: monospace; }
        .success { background: #2e3f33; border: 1px solid #a6e3a1; color: #a6e3a1; }
        .error { background: #4c3232; border: 1px solid #f38ba8; color: #f38ba8; }
    </style>
</head>
<body>

    <h2>🛠️ Lab d'Upload - GuardiHack</h2>
    <div class="card">
        <form id="uploadForm">
            <div class="form-group">
                <label for="challenge_id">ID du Challenge :</label>
                <input type="number" id="challenge_id" value="1" required>
            </div>

            <div class="form-group">
                <label for="file_input">Sélectionner le fichier :</label>
                <input type="file" id="file_input" required>
            </div>

            <div class="form-group">
                <label for="file_name">Nom personnalisé (Optionnel) :</label>
                <input type="text" id="file_name" placeholder="Ex: crackme_level1">
            </div>

            <div class="form-group">
                <label for="file_type">Rôle du fichier (file_type) :</label>
                <select id="file_type">
                    <option value="main">Principal (Binaire / Source / PCAP)</option>
                    <option value="hint">Indice / Fichier secondaire</option>
                </select>
            </div>

            <button type="submit">Envoyer le fichier</button>
        </form>

        <div id="response"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const responseDiv = document.getElementById('response');
            responseDiv.style.display = 'none';
            
            const challengeId = document.getElementById('challenge_id').value;
            const fileInput = document.getElementById('file_input').files[0];
            const fileName = document.getElementById('file_name').value;
            const fileType = document.getElementById('file_type').value;

            // Construction du FormData
            const formData = new FormData();
            formData.append('file', fileInput); // Clé 'file' (plus de liste)
            formData.append('file_type', fileType);
            if (fileName.trim() !== '') {
                formData.append('file_name', fileName);
            }

            try {
                // Appel vers l'API de ton conteneur Flask
                const response = await fetch(`http://localhost:9414/api/admin/challenge/files/add/${challengeId}`, {
                    method: 'POST',
                    body: formData
                    // Note: Le Content-Type multipart/form-data est géré automatiquement par fetch avec le FormData
                });

                const data = await response.json();
                
                responseDiv.style.display = 'block';
                responseDiv.textContent = JSON.stringify(data, null, 2);
                
                if (response.ok && data.status === 'success') {
                    responseDiv.className = 'success';
                } else {
                    responseDiv.className = 'error';
                }

            } catch (error) {
                responseDiv.style.display = 'block';
                responseDiv.className = 'error';
                responseDiv.textContent = `Erreur réseau ou CORS : Pouvait pas joindre le serveur.\n${error.message}`;
            }
        });
    </script>
</body>
</html>
