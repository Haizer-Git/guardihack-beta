<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">

  <div class="flex items-center justify-center min-h-screen p-6 font-mono text-slate-200">
    <div class="w-full max-w-6xl border border-emerald-500/30 bg-slate-900/80 shadow-[0_0_30px_rgba(16,185,129,0.05)] backdrop-blur-sm rounded-xl overflow-visible relative">
      
      <div class="flex items-stretch justify-between bg-slate-950/80 border-b border-emerald-500/20 px-4 pt-4">
        <div class="flex gap-2">
          <span class="px-6 py-1.5 text-sm uppercase tracking-widest bg-slate-800 text-emerald-400 border border-emerald-500/30 rounded-t-md font-black min-w-[120px] text-center">
            Rank
          </span>
          <span class="px-12 py-1.5 text-sm uppercase tracking-widest bg-slate-900 text-slate-300 border-t border-x border-slate-700/50 rounded-t-md font-bold">
            Username
          </span>
        </div>
        
        <div class="px-9 py-3 bg-emerald-500/10 border-x border-t border-emerald-500/30 rounded-t-lg shadow-[inset_0_1px_0_rgba(52,211,153,0.2)] flex flex-col items-center gap-2">
          <input type="text" placeholder="Rechercher..." class="px-10 py-1 text-sm rounded bg-slate-800/50 border border-slate-700/50 text-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition-colors">
        </div>
        
        <div class="flex gap-2">
          <span class="px-8 py-1.5 text-sm uppercase tracking-widest bg-slate-900 text-slate-300 border-t border-x border-slate-700/50 rounded-t-md font-bold">
            Score
          </span>
          <span class="px-6 py-1.5 text-sm uppercase tracking-widest bg-slate-800 text-cyan-400 border border-cyan-500/30 rounded-t-md font-black min-w-[130px] text-center">
            Niveau
          </span>
        </div>
      </div>

      <div class="p-4 bg-slate-900/40">
        <div class="border border-slate-800 rounded-lg overflow-hidden bg-slate-950/40">
          <table class="w-full text-left border-collapse">
            <tbody class="divide-y divide-slate-800/60 text-sm">
              <tr class="hover:bg-emerald-500/5 transition-colors group">
                <td class="py-4 px-4 text-center font-bold text-emerald-400 font-mono w-[90px]">
                  <div class="flex items-center justify-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    01
                  </div>
                </td>
                <td class="py-4 px-4 font-semibold text-slate-100 group-hover:text-emerald-300 transition-colors">
                  GhostInTheShellcode
                </td>
                <td class="py-4 px-8 text-right font-mono text-emerald-400 font-bold w-[120px]">
                  14,250
                </td>
                <td class="py-4 px-4 text-center w-[110px]">
                  <span class="px-2 py-0.5 text-xs rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Expert</span>
                </td>
              </tr>
              <tr class="hover:bg-slate-800/40 transition-colors">
                <td class="py-4 px-4 text-center font-bold text-slate-400 font-mono w-[90px]">02</td>
                <td class="py-4 px-4 font-semibold text-slate-200">r00t_b00t</td>
                <td class="py-4 px-8 text-right font-mono text-slate-300 w-[120px]">12,800</td>
                <td class="py-4 px-4 text-center w-[110px]">
                  <span class="px-2 py-0.5 text-xs rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Expert</span>
                </td>
              </tr>
              <tr class="hover:bg-slate-800/40 transition-colors">
                <td class="py-4 px-4 text-center font-bold text-slate-500 font-mono w-[90px]">03</td>
                <td class="py-4 px-4 font-semibold text-slate-200">CyberPanda</td>
                <td class="py-4 px-8 text-right font-mono text-slate-300 w-[120px]">11,150</td>
                <td class="py-4 px-4 text-center w-[110px]">
                  <span class="px-2 py-0.5 text-xs rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Intermed</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="flex justify-center bg-slate-950/60 border-t border-slate-800/60 py-3">
        <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 px-3 py-1 rounded-md text-xs font-mono">
          <button class="px-2 py-1 text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded font-bold shadow-[0_0_10px_rgba(16,185,129,0.1)]">[1]</button>
          <span class="text-slate-600 px-1">|</span>
          <button class="px-2 py-1 text-slate-400 hover:text-slate-200 transition-colors">[2]</button>
          <button class="ml-2 text-emerald-400 hover:translate-x-0.5 transition-transform">&gt;</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
