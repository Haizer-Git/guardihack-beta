<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lab Badges - GuardiHack</title>
    <style>
        body { font-family: sans-serif; background: #1e1e2e; color: #cdd6f4; max-width: 900px; margin: 40px auto; padding: 20px; }
        
        /* Onglets */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #45475a; padding-bottom: 10px; }
        .tab-btn { background: #313244; color: #cdd6f4; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .tab-btn.active { background: #cba6f7; color: #11111b; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Formulaire & Cartes */
        .card { background: #313244; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { margin-bottom: 5px; font-weight: bold; color: #cba6f7; }
        input, select, textarea { padding: 10px; border-radius: 4px; border: 1px solid #45475a; background: #11111b; color: #cdd6f4; font-size: 14px; }
        textarea { resize: vertical; min-height: 60px; }
        
        button.submit-btn { background: #cba6f7; color: #11111b; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; width: 100%; }
        button.submit-btn:hover { background: #f5c2e7; }
        
        /* Grille de la liste */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .badge-card { background: #313244; border-radius: 8px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; }
        .badge-icon { width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px; background: #11111b; padding: 8px; border-radius: 50%; border: 2px solid #45475a; }
        .badge-name { font-size: 18px; font-weight: bold; color: #cba6f7; margin-bottom: 5px; }
        .badge-type { font-size: 12px; text-transform: uppercase; background: #45475a; padding: 3px 8px; border-radius: 12px; color: #bac2de; margin-bottom: 10px; }
        .badge-desc { font-size: 14px; color: #a6adc8; margin-bottom: 15px; flex-grow: 1; }
        .badge-req { font-size: 12px; background: #181825; padding: 8px; border-radius: 4px; border-left: 3px solid #a6e3a1; text-align: left; width: 100%; box-sizing: border-box; }
        
        /* Notifications de statut */
        #globalMessage { padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none; font-family: monospace; }
        .success { background: #2e3f33; border: 1px solid #a6e3a1; color: #a6e3a1; }
        .error { background: #4c3232; border: 1px solid #f38ba8; color: #f38ba8; }
    </style>
</head>
<body>

    <h2>🛠️ Lab d'Administration des Badges - GuardiHack</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('createTab')">➕ Créer un Badge</button>
        <button class="tab-btn" id="listTabBtn" onclick="switchTab('listTab')">🏅 Liste des Badges</button>
    </div>

    <div id="globalMessage"></div>

    <div id="createTab" class="tab-content active">
        <div class="card">
            <form id="badgeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Nom du Badge :</label>
                        <input type="text" id="name" placeholder="Ex: Premier Sang" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type de Badge :</label>
                        <input type="text" id="type" placeholder="Ex: global, ctf, event" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description :</label>
                    <textarea id="description" placeholder="Ex: Obtenu après avoir validé le premier challenge d'un CTF." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="requirement_type">Type de prérequis :</label>
                        <input type="text" id="requirement_type" placeholder="Ex: ctf_solves" required>
                    </div>
                    <div class="form-group">
                        <label for="requirement_value">Valeur du prérequis :</label>
                        <input type="text" id="requirement_value" placeholder="Ex: 1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="requirement_text">Texte explicatif du prérequis :</label>
                    <input type="text" id="requirement_text" placeholder="Ex: Résoudre un challenge en premier." required>
                </div>

                <div class="form-group">
                    <label for="file">Icône du Badge (PNG, JPG, GIF, SVG) :</label>
                    <input type="file" id="file" accept="image/*" required>
                </div>

                <button type="submit" class="submit-btn">Créer le Badge</button>
            </form>
        </div>
    </div>

    <div id="listTab" class="tab-content">
        <div class="grid" id="badgesGrid"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:9414';

        // Gestion de la bascule d'onglets
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            
            // Masquer les notifications lors du changement d'onglet
            document.getElementById('globalMessage').style.display = 'none';

            // Si on clique sur la liste, on la rafraîchit automatiquement
            if (tabId === 'listTab') {
                fetchBadges();
            }
        }

        // Action : Soumission du formulaire (Création)
        document.getElementById('badgeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('globalMessage');
            msgDiv.style.display = 'none';
            
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('type', document.getElementById('type').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('requirement_type', document.getElementById('requirement_type').value);
            formData.append('requirement_value', document.getElementById('requirement_value').value);
            formData.append('requirement_text', document.getElementById('requirement_text').value);
            formData.append('file', document.getElementById('file').files[0]);

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/badge/create`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                msgDiv.style.display = 'block';
                
                if (response.status === 201 && data.status === 'success') {
                    msgDiv.className = 'success';
                    msgDiv.textContent = `Succès ! Badge créé (ID: ${data.badge_id}). Bascule automatique vers la liste...`;
                    
                    // Reset du formulaire
                    document.getElementById('badgeForm').reset();
                    
                    // Redirection automatique vers la liste après 1.5s
                    setTimeout(() => {
                        document.getElementById('listTabBtn').click();
                    }, 1500);
                } else {
                    msgDiv.className = 'error';
                    msgDiv.textContent = `Erreur [${data.slug || response.status}] : ${data.message}`;
                }
            } catch (error) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'error';
                msgDiv.textContent = `Erreur réseau : Impossible de contacter le backend.\n${error.message}`;
            }
        });

        // Action : Récupération et affichage de la liste
        async function fetchBadges() {
            const grid = document.getElementById('badgesGrid');
            const msgDiv = document.getElementById('globalMessage');
            grid.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/badge/list`);
                const data = await response.json();

                if (!response.ok || data.status !== 'success') {
                    throw new Error(data.message || `Status: ${response.status}`);
                }

                if (data.badges.length === 0) {
                    msgDiv.style.display = 'block';
                    msgDiv.className = 'error';
                    msgDiv.textContent = "Aucun badge n'est enregistré dans la base pour le moment.";
                    return;
                }

                data.badges.forEach(badge => {
                    const card = document.createElement('div');
                    card.className = 'badge-card';

                    // Nettoyage et construction du chemin absolu de l'icône statique
                    const imageUrl = badge.icon_url.startsWith('http') 
                        ? badge.icon_url 
                        : `${API_BASE_URL}/${badge.icon_url.replace(/^\.\//, '')}`;

                    card.innerHTML = `
                        <img src="${imageUrl}" alt="${badge.name}" class="badge-icon" onerror="this.src='https://placehold.co/80?text=Erreur'">
                        <div class="badge-name">${badge.name}</div>
                        <div class="badge-type">${badge.type}</div>
                        <div class="badge-desc">${badge.description}</div>
                        <div class="badge-req">
                            <strong>Prérequis:</strong> ${badge.requirement_text}<br>
                            <small>(${badge.requirement_type} : ${badge.requirement_value})</small>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'error';
                msgDiv.textContent = `Erreur de chargement de la liste :\n${error.message}`;
            }
        }
    </script>
</body>
</html>
