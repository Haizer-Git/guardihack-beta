<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GuardiHack - Terminal Cosmétique</title>
<style>
@font-face {
  font-family: 'VT323';
  font-style: normal;
  font-weight: 400;
  src: url(https://fonts.gstatic.com/s/vt323/v18/pxiKyp0ihIEF2isfFJA.ttf) format('truetype');
}
* { box-sizing: border-box; }
body {
  background: #111; /* Fond noir profond en cas de vitre brisée */
  color: #14fdce;
  font-family: 'VT323', monospace;
  font-size: 24px;
  -webkit-font-smoothing: none;
  line-height: 1.2;
  overflow: hidden;
}
h1 { font-size: 4rem; margin-bottom: 1rem; text-transform: uppercase; }
p { margin-bottom: 0.5rem; }

.piece { display: block; height: 100%; left: 0; top: 0; width: 100%; }
.noclick { pointer-events: none; }
.frame {
  background-color: transparent;
  border-radius: 2rem;
  border: 1rem solid;
  border-bottom-color: #121212;
  border-left-color: #080808;
  border-right-color: #080808;
  border-top-color: #020202;
  box-shadow: inset 0 0 18rem black, inset 0 0 3rem black, 0 0 10rem black;
  height: 96%;
  position: absolute;
  top: 2%; left: 2%; width: 96%;
  pointer-events: none;
  transition: all 0.1s;
}

.output {
  animation: crt-output 10ms infinite;
  background-color: #031e11;
  overflow-y: auto;
  position: absolute;
  padding: 3rem 2rem;
  pointer-events: auto;
  text-shadow: 0rem 0.2rem 1rem #0c7b46;
  z-index: 5;
  width: 100%; height: 100%;
  top: 0; left: 0;
}

.danger-flicker {
  animation: bg-danger 0.15s infinite;
}
@keyframes bg-danger {
  0%, 100% { background-color: #031e11; }
  50% { background-color: #2b0000; }
}

@keyframes crt-output { 0% { opacity: 0.9; } 50% { opacity: 1; } }

.scanlines {
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.2) 70%, rgba(0, 0, 0, 0.6));
  background-size: 100% 0.3rem;
  border-radius: 2rem;
  position: absolute;
  z-index: 10;
}
.glow {
  animation: crt-glow 60s infinite;
  background: radial-gradient(circle at center, #1bd459 0%, rgba(27, 212, 89, 0.88) 58%, rgba(21, 235, 92, 0.57) 80%, rgba(19, 94, 29, 0.27) 93%, rgba(10, 23, 12, 0) 100%);
  opacity: 0.15;
  pointer-events: none;
  position: fixed;
  z-index: 11;
}
@keyframes crt-glow { 0% { opacity: 0.1; } 50% { opacity: 0.2; } }

::-moz-selection { background-color: #14fdce; color: #031e11; }
::selection { background-color: #14fdce; color: #031e11; }

.controls-container {
  margin-bottom: 20px;
  display: flex;
  gap: 15px;
  align-items: center;
  flex-wrap: wrap;
}

.retro-select {
  background: #031e11;
  color: #14fdce;
  border: 2px solid #14fdce;
  font-family: 'VT323', monospace;
  font-size: 24px;
  padding: 5px 10px;
  outline: none;
  cursor: pointer;
}
.retro-select:focus { background: #14fdce; color: #031e11; }

.mine-button {
  background: #14fdce;
  color: #031e11;
  border: none;
  padding: 10px 20px;
  font-family: 'VT323', monospace;
  font-size: 28px;
  cursor: pointer;
  text-transform: uppercase;
  font-weight: bold;
  box-shadow: 0 0 10px #14fdce;
  transition: all 0.2s;
  pointer-events: auto;
}
.mine-button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
.mine-button:disabled { background: #555; color: #222; box-shadow: none; cursor: not-allowed; border: 2px solid #222; }

.log-line { margin: 0; padding: 2px 0; opacity: 0.9; }
.log-warn { color: #fbc531; text-shadow: 0 0 5px #fbc531; }
.log-err { color: #e84118; font-weight: bold; text-shadow: 0 0 8px #e84118; }
.log-success { color: #1bd459; font-weight: bold; text-shadow: 0 0 5px #1bd459; }
.log-sys { color: #9c88ff; font-weight: bold; }

.glitch-text { animation: text-glitch 0.1s infinite; display: inline-block; }
@keyframes text-glitch {
  0% { transform: translate(0); }
  25% { transform: translate(-2px, 1px); }
  50% { transform: translate(2px, -1px); }
  75% { transform: translate(-1px, 2px); }
  100% { transform: translate(1px, -1px); }
}

/* --- STRUCTURE DE L'ÉCRAN BRISÉ --- */
.shatter-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 6; /* Juste au-dessus du terminal mort */
  pointer-events: none;
}
.shard {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: #031e11;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
  transition: transform 1.2s cubic-bezier(0.1, 0.85, 0.25, 1), opacity 0.8s;
  transform-origin: center;
}
/* Découpe géométrique des morceaux - Fissure en étoile au centre */
.shard-1 { clip-path: polygon(0% 0%, 50% 0%, 50% 50%, 0% 50%); }
.shard-2 { clip-path: polygon(50% 0%, 100% 0%, 100% 50%, 50% 50%); }
.shard-3 { clip-path: polygon(100% 50%, 100% 100%, 50% 100%, 50% 50%); }
.shard-4 { clip-path: polygon(50% 100%, 0% 100%, 0% 50%, 50% 50%); }
.shard-5 { clip-path: polygon(40% 0%, 60% 0%, 50% 50%); }
.shard-6 { clip-path: polygon(100% 40%, 100% 60%, 50% 50%); }
.shard-7 { clip-path: polygon(60% 100%, 40% 100%, 50% 50%); }
.shard-8 { clip-path: polygon(0% 60%, 0% 40%, 50% 50%); }

/* Éclatement physique vers l'extérieur avec fissure radiale */
.shattered .shard-1 { transform: translate(-30%, -30%) rotate(-8deg); opacity: 0.12; }
.shattered .shard-2 { transform: translate(30%, -30%) rotate(8deg); opacity: 0.12; }
.shattered .shard-3 { transform: translate(30%, 30%) rotate(-12deg); opacity: 0.12; }
.shattered .shard-4 { transform: translate(-30%, 30%) rotate(12deg); opacity: 0.12; }
.shattered .shard-5 { transform: translate(0%, -60%) rotate(2deg); opacity: 0.15; }
.shattered .shard-6 { transform: translate(60%, 0%) rotate(-5deg); opacity: 0.15; }
.shattered .shard-7 { transform: translate(0%, 60%) rotate(-2deg); opacity: 0.15; }
.shattered .shard-8 { transform: translate(-60%, 0%) rotate(5deg); opacity: 0.15; }

/* RECOMPENSE ATTENDANT DERRIÈRE */
.resource-display {
  display: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 2; /* Rendu en arrière-plan sous la vitre cassée */
  width: 100%;
  pointer-events: auto;
}
.legendary-flicker {
  animation: leg-flicker 1.8s ease-out forwards;
}
@keyframes leg-flicker {
  0%, 12%, 28%, 40% { opacity: 0; filter: none; }
  5%, 20%, 35%, 45%, 100% { opacity: 1; filter: drop-shadow(0 0 35px #fbc531); }
}

.resource-name {
  font-size: 6rem;
  text-shadow: 0 0 30px currentColor;
  animation: pulse 1s infinite alternate;
  margin-bottom: 30px;
  font-weight: bold;
}
.resource-type { font-size: 2rem; opacity: 0.9; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 5px;}

.shake-light { animation: shake-light 0.2s infinite; }
.shake-medium { animation: shake-medium 0.15s infinite; }
.shake-hard { animation: hard-shake 0.1s infinite; }

@keyframes shake-light { 0%, 100% { transform: translate(1px, 0px); } 50% { transform: translate(-1px, 0px); } }
@keyframes shake-medium { 0%, 100% { transform: translate(2px, 1px) rotate(0deg); } 50% { transform: translate(-2px, -1px) rotate(-1deg); } }
@keyframes hard-shake {
  0% { transform: translate(6px, 4px) rotate(0deg); }
  25% { transform: translate(-6px, -4px) rotate(-2deg); }
  50% { transform: translate(0px, 6px) rotate(2deg); }
  75% { transform: translate(6px, -6px) rotate(-1deg); }
  100% { transform: translate(-5px, 4px) rotate(1deg); }
}

.white-flash {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: white;
  z-index: 100;
  pointer-events: none;
  animation: flash-fade 1.8s forwards;
}
@keyframes flash-fade { 0% { opacity: 1; } 100% { opacity: 0; display: none; } }

.particle {
  position: absolute;
  background: #14fdce;
  box-shadow: 0 0 15px currentColor;
  pointer-events: none;
  z-index: 99;
  animation: fly-out 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
}
@keyframes fly-out {
  0% { opacity: 1; transform: scale(1) translate(0, 0) rotate(0deg); }
  100% { opacity: 0; transform: scale(0.3) translate(var(--tx), var(--ty)) rotate(280deg); }
}

@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

/* Fumée qui entoure la ressource */
.smoke {
  position: absolute;
  background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(100,100,100,0.2) 70%, transparent 100%);
  border-radius: 50%;
  filter: blur(15px);
  pointer-events: none;
  animation: smoke-rise 3s ease-in forwards;
}
@keyframes smoke-rise {
  0% { opacity: 0.6; transform: translate(var(--sx), 0px) scale(1); }
  100% { opacity: 0; transform: translate(var(--sx), -200px) scale(1.5); }
}

.hidden { display: none !important; }
</style>
</head>

<body class="noisy">
<div class="emblem"><span class="icon-information"></span></div>
<div class="frame" id="monitor-frame">
  
  <div class="piece output" id="terminal">
    <div class="controls-container" id="controls">
      <select id="rarity-select" class="retro-select">
        <option value="random">Aléatoire (Prod)</option>
        <option value="0">Force: Commun</option>
        <option value="1">Force: Rare</option>
        <option value="2">Force: Épique</option>
        <option value="3">Force: LÉGENDAIRE</option>
        <option value="fake_downgrade">FEINTE: Défaillance (Lég -> Com)</option>
        <option value="fake_upgrade">FEINTE: Éveil (Com -> Lég)</option>
      </select>
      <button id="mineBtn" class="mine-button">FORCER L'ARCHIVE</button>
    </div>
    <div id="content"></div>
  </div>

  <div class="shatter-overlay hidden" id="shatter-overlay">
    <div class="shard shard-1"></div>
    <div class="shard shard-2"></div>
    <div class="shard shard-3"></div>
    <div class="shard shard-4"></div>
    <div class="shard shard-5"></div>
    <div class="shard shard-6"></div>
    <div class="shard shard-7"></div>
    <div class="shard shard-8"></div>
  </div>
  
  <div class="piece scanlines noclick" id="screen-scanlines"></div>
  <div class="piece glow noclick" id="screen-glow"></div>
  
  <div id="explosion-container" class="explosion-container"></div>
  
  <div id="resource-display" class="resource-display">
    <div id="res-type" class="resource-type"></div>
    <div id="res-name" class="resource-name"></div>
    <button id="resetBtn" class="mine-button" style="box-shadow: 0 0 20px #fff; background: #fff; margin-top: 25px;">CONTINUER LE CTF</button>
  </div>
</div>

<script>
const LOOT_TABLE = [
  { name: "Avatar : Script Kiddie", type: "Commun", color: "#1bd459", weight: 50, lagLevel: 0 },
  { name: "Bannière : Terminal Basique", type: "Commun", color: "#1bd459", weight: 50, lagLevel: 0 },
  { name: "Titre : Root Local", type: "Rare", color: "#00a8ff", weight: 30, lagLevel: 1 },
  { name: "Badge : Chasseur de Flags", type: "Rare", color: "#00a8ff", weight: 30, lagLevel: 1 },
  { name: "Bannière Animée : Glitch Core", type: "Épique", color: "#9c88ff", weight: 12, lagLevel: 2 },
  { name: "Avatar : Netrunner", type: "Épique", color: "#9c88ff", weight: 12, lagLevel: 2 },
  { name: "Titre : SYSADMIN [GOD MODE]", type: "LÉGENDAIRE", color: "#fbc531", weight: 3, lagLevel: 3 },
  { name: "Skin Profil : 0-DAY EXPLOIT", type: "LÉGENDAIRE", color: "#fbc531", weight: 3, lagLevel: 3 }
];

const LOG_MESSAGES = [
  "SYS_INIT: Initialisation de l'environnement GuardiHack...",
  "BUFF_INJECT: Injection du payload initial...",
  "NET_SCAN: Analyse des paquets réseau entrants...",
  "FW_DISABLED: Désactivation du pare-feu local...",
  "SQL_BYPASS: Tentative d'escalade de privilèges via DB...",
  "HASH_EXTRACT: Extraction de la structure de l'archive...",
  "TUNNEL_OPEN: Connexion sécurisée au bloc établie...",
  "AUTH_TOKEN: Génération de la signature numérique..."
];

const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>/\\!?{}[]";
const terminal = document.getElementById('terminal');
const contentDiv = document.getElementById('content');
const mineBtn = document.getElementById('mineBtn');
const raritySelect = document.getElementById('rarity-select');
const monitorFrame = document.getElementById('monitor-frame');
const shatterOverlay = document.getElementById('shatter-overlay');
const scanlines = document.getElementById('screen-scanlines');
const glowLayer = document.getElementById('screen-glow');
const explosionContainer = document.getElementById('explosion-container');
const resourceDisplay = document.getElementById('resource-display');
const resName = document.getElementById('res-name');
const resType = document.getElementById('res-type');
const resetBtn = document.getElementById('resetBtn');

let isMining = false;

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

function getLootByLagLevel(level) {
  const possible = LOOT_TABLE.filter(item => item.lagLevel === level);
  return possible[Math.floor(Math.random() * possible.length)];
}

function rollLoot(forcedLevel) {
  if (forcedLevel === 'fake_downgrade' || forcedLevel === 'fake_upgrade') return null;
  if (forcedLevel !== 'random') {
    return getLootByLagLevel(parseInt(forcedLevel));
  }
  const totalWeight = LOOT_TABLE.reduce((sum, item) => sum + item.weight, 0);
  let random = Math.random() * totalWeight;
  for (const item of LOOT_TABLE) {
    if (random < item.weight) return item;
    random -= item.weight;
  }
  return LOOT_TABLE[0];
}

async function scrambleText(text, element, duration = 300) {
  let iterations = 0;
  const maxIterations = text.length;
  const interval = duration / maxIterations;

  return new Promise(resolve => {
    const timer = setInterval(() => {
      element.innerText = text.split("").map((letter, index) => {
        if (index < iterations) return text[index];
        return chars[Math.floor(Math.random() * chars.length)];
      }).join("");

      if (iterations >= maxIterations) {
        clearInterval(timer);
        resolve();
      }
      iterations += 1;
    }, interval);
  });
}

async function addLogWithScramble(text, className = "", scrambleDuration = 250) {
  const p = document.createElement('p');
  p.className = `log-line ${className}`;
  contentDiv.appendChild(p);
  terminal.scrollTop = terminal.scrollHeight;
  await scrambleText("> " + text, p, scrambleDuration);
  return p;
}

async function drawProgressBar(lagLevel, isTroll, isSurprise) {
  const p = document.createElement('p');
  p.className = "log-line log-warn";
  contentDiv.appendChild(p);
  
  const totalBars = 30;
  let currentPct = 0;
  let hasGlitched = false;
  const isHeavyLag = (lagLevel >= 2 || isTroll);

  while (currentPct <= 100) {
    // Micro-ralentissements systématiques entre 88% et 94% pour la tension
    let stepDelay = 35;
    if (currentPct >= 88 && currentPct <= 94) {
      stepDelay = Math.floor(Math.random() * 200) + 120; 
    } else if (currentPct > 94) {
      stepDelay = 70;
    }

    if (isHeavyLag && currentPct >= 92 && !hasGlitched) {
      hasGlitched = true;
      monitorFrame.className = 'frame shake-medium';
      
      for (let rollback = 0; rollback < 4; rollback++) {
        currentPct -= Math.floor(Math.random() * 7) + 3;
        if(currentPct < 60) currentPct = 60;
        
        let barCount = Math.floor((currentPct / 100) * totalBars);
        let filled = "█".repeat(barCount);
        let empty = Array.from({length: totalBars - barCount}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
        
        p.className = "log-line log-err glitch-text";
        p.innerText = `[MEM_CORRUPT: 0x${Math.floor(Math.random()*9999).toString(16).toUpperCase()}] [${filled}${empty}] ${currentPct}%`;
        terminal.scrollTop = terminal.scrollHeight;
        await sleep(180);
      }
      
      // Crash du Légendaire (bloqué à 96%)
      if (lagLevel === 3 && !isSurprise) {
        monitorFrame.className = 'frame shake-hard';
        p.innerText = `[CRITICAL_FAILURE: KERNEL_PANIC_DUMP_STREAM] [██████████████████████████░░░] 96%`;
        await sleep(750);
        return false; 
      }
      
      monitorFrame.className = 'frame shake-light';
      p.className = "log-line log-warn";
    }

    let barCount = Math.floor((currentPct / 100) * totalBars);
    let filled = "█".repeat(barCount);
    let empty = "▒".repeat(totalBars - barCount);
    p.innerText = `[${filled}${empty}] ${currentPct}%`;
    terminal.scrollTop = terminal.scrollHeight;

    await sleep(stepDelay);
    currentPct += 1;
  }
  return true; 
}

function triggerPhysicalExplosion(color) {
  // 1. Déclenchement du flash de lumière blanche
  const flash = document.createElement('div');
  flash.className = 'white-flash';
  document.body.appendChild(flash);

  // 2. Affichage de l'overlay de verre brisé et éclatement
  shatterOverlay.classList.remove('hidden');
  setTimeout(() => {
    shatterOverlay.classList.add('shattered');
  }, 20);
  
  // 3. Projection d'éclats acérés partout sur l'écran avec plus d'intensité
  for(let i = 0; i < 120; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = '50%';
    p.style.top = '50%';
    
    // Éclats variables - certains longs, certains courts
    const isLongShard = Math.random() > 0.6;
    if (isLongShard) {
      p.style.width = `${Math.random() * 8 + 1}px`;
      p.style.height = `${Math.random() * 60 + 20}px`;
    } else {
      p.style.width = `${Math.random() * 15 + 3}px`;
      p.style.height = `${Math.random() * 20 + 5}px`;
    }
    
    // Distribution radiale plus prononcée
    const angle = (Math.random() * Math.PI * 2);
    const distance = Math.random() * 2000 + 800;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance;
    
    p.style.setProperty('--tx', `${tx}px`);
    p.style.setProperty('--ty', `${ty}px`);
    p.style.color = Math.random() > 0.3 ? color : '#031e11';
    p.style.background = p.style.color;
    p.style.boxShadow = `0 0 ${Math.random() * 20 + 10}px ${p.style.color}`;
    explosionContainer.appendChild(p);
  }

  setTimeout(() => {
    flash.remove();
    explosionContainer.innerHTML = '';
  }, 2000);
}

function generateSmoke(color) {
  // Générer de la fumée autour de la ressource affichée
  for (let i = 0; i < 8; i++) {
    const smoke = document.createElement('div');
    smoke.className = 'smoke';
    
    const size = Math.random() * 150 + 100;
    smoke.style.width = `${size}px`;
    smoke.style.height = `${size}px`;
    
    const offsetX = (Math.random() - 0.5) * 200;
    smoke.style.setProperty('--sx', `${offsetX}px`);
    
    smoke.style.left = `calc(50% - ${size / 2}px)`;
    smoke.style.top = `calc(50% - ${size / 2}px)`;
    smoke.style.background = `radial-gradient(circle, ${color}40 0%, ${color}20 40%, transparent 100%)`;
    smoke.style.filter = 'blur(20px)';
    
    resourceDisplay.appendChild(smoke);
  }
}

async function startMining() {
  if (isMining) return;
  isMining = true;
  mineBtn.disabled = true;
  raritySelect.disabled = true;
  contentDiv.innerHTML = '';
  monitorFrame.className = 'frame';
  terminal.classList.remove('danger-flicker');
  
  let forcedMode = raritySelect.value;
  if (forcedMode === 'random') {
      const randVal = Math.random();
      if (randVal > 0.96) forcedMode = 'fake_upgrade';
      else if (randVal > 0.92) forcedMode = 'fake_downgrade';
  }

  const isTroll = (forcedMode === 'fake_downgrade');
  const isSurprise = (forcedMode === 'fake_upgrade');
  
  let finalLoot;
  if (isTroll) finalLoot = getLootByLagLevel(0); 
  else if (isSurprise) finalLoot = getLootByLagLevel(3); 
  else finalLoot = rollLoot(forcedMode);

  // Page 1 : Initialisation des systèmes de logs
  for (let i = 0; i < 5; i++) {
    const randomLog = LOG_MESSAGES[Math.floor(Math.random() * LOG_MESSAGES.length)];
    await addLogWithScramble(randomLog, "", 100 + Math.random() * 100);
    await sleep(Math.random() * 100 + 50);
  }

  // Séquence de chargement
  await addLogWithScramble("DATA_STREAM: Extraction du segment d'archive...", "log-warn");
  const successLoad = await drawProgressBar(finalLoot.lagLevel, isTroll, isSurprise);
  await sleep(200);

  // Page 2 (Si crash ou traitement d'exception lourd)
  if (!successLoad) {
    // Séquence VRAI LÉGENDAIRE : Crash système étendu avant la fin
    monitorFrame.className = 'frame shake-hard';
    terminal.classList.add('danger-flicker');
    await addLogWithScramble("HARDWARE_ALERT: STRUCT_OVERFLOW_FATAL_CORE", "log-err glitch-text", 400);
    await sleep(500);
    await addLogWithScramble("SANDBOX_BREACH: SIGNATURE_0DAY_DETECTED", "log-sys", 400);
    await sleep(700);
    
    const countdown = await addLogWithScramble("TERMINAL_KILL_SEQ_IN_3", "log-err"); await sleep(900);
    countdown.innerText = "> TERMINAL_KILL_SEQ_IN_2"; await sleep(900);
    countdown.innerText = "> TERMINAL_KILL_SEQ_IN_1"; await sleep(1100);
    
    // BLACKOUT COMPLET DU TERMINAL (Extinction totale de la dalle)
    terminal.classList.add('hidden');
    scanlines.classList.add('hidden');
    glowLayer.classList.add('hidden');
    await sleep(250); // Petit instant de silence et de noir absolu avant l'impact
    
    triggerPhysicalExplosion(finalLoot.color);
    await sleep(150);

  } else {
    if (isTroll) {
      monitorFrame.className = 'frame shake-hard';
      terminal.classList.add('danger-flicker');
      await addLogWithScramble("ERR_DUMP: EXTRACT_VIOLATION_ENCOUNTERED", "log-err glitch-text", 400);
      await sleep(1200);
      
      monitorFrame.className = 'frame';
      terminal.classList.remove('danger-flicker');
      await addLogWithScramble("SYS_RECOVERY: Restauration des tables d'allocation.", "log-success", 400);
      await sleep(600);
      await addLogWithScramble("SYS_STATUS: Code d'erreur résolu. Segment secondaire extrait.", "log-warn", 400);
      await sleep(1200);

    } else if (isSurprise) {
      // FEINTE DE L'ÉVEIL : Chargement propre, puis piratage violent de l'affichage
      monitorFrame.className = 'frame shake-light';
      await addLogWithScramble("INTEGRITY_CHECK: Validating payload signature...", "log-success", 300);
      await sleep(1000);
      
      monitorFrame.className = 'frame shake-hard';
      terminal.classList.add('danger-flicker');
      contentDiv.innerHTML = ''; 
      await sleep(200);
      
      await addLogWithScramble("OVERRIDE: KERNEL_HIJACK_EXECUTED", "log-err glitch-text", 400);
      await sleep(500);
      await addLogWithScramble("SANDBOX_BREACH: FORCING_LEGENDARY_SEGMENT", "log-sys glitch-text", 500);
      await sleep(1000);
      
      const countdown = await addLogWithScramble("TERMINAL_KILL_SEQ_IN_3", "log-err"); await sleep(900);
      countdown.innerText = "> TERMINAL_KILL_SEQ_IN_2"; await sleep(900);
      countdown.innerText = "> TERMINAL_KILL_SEQ_IN_1"; await sleep(1100);
      
      // Blackout & Explosion
      terminal.classList.add('hidden');
      scanlines.classList.add('hidden');
      glowLayer.classList.add('hidden');
      await sleep(200);

      triggerPhysicalExplosion(finalLoot.color);
      await sleep(150);

    } else {
      // LOOTS CLASSIQUES SANS CRACH (Commun, Rare, Épique)
      if (finalLoot.lagLevel === 0) {
        monitorFrame.className = 'frame shake-light';
        await addLogWithScramble("INTEGRITY_CHECK: Alignement des blocs...", "", 300);
        await sleep(400);
      } else if (finalLoot.lagLevel >= 1) {
        await addLogWithScramble("INTEGRITY_WARN: Décalage de bit détecté. Forçage...", "log-warn", 400);
        monitorFrame.className = 'frame shake-light';
        await sleep(700);
        
        if (finalLoot.lagLevel === 2) {
          monitorFrame.className = 'frame shake-medium';
          await addLogWithScramble("FW_ALERT: Reroutage dynamique des descripteurs.", "log-err", 400);
          await sleep(700);
          await addLogWithScramble("DECRYPT_SEQ: Décryptage de la clé asymétrique.", "log-warn", 500);
          await sleep(1000);
        }
      }
    }
  }

  // Révélation de la récompense finale
  monitorFrame.className = 'frame';

  if(finalLoot.lagLevel === 3) {
    // Si Légendaire : La fissure reste visible avec fumée autour
    resourceDisplay.classList.add('legendary-flicker');
    // Ne pas masquer la fissure - elle reste visible
    shatterOverlay.classList.remove('hidden');
    generateSmoke(finalLoot.color);
  } else {
    await addLogWithScramble("PROCESS_END: Opération terminée.", "log-success", 200);
    await sleep(600);
    contentDiv.innerHTML = '';
    terminal.classList.add('hidden');
  }

  resType.textContent = finalLoot.type;
  resType.style.color = finalLoot.color;
  resType.className = `resource-type ${finalLoot.lagLevel === 3 ? 'glitch-text' : ''}`;
  resName.textContent = finalLoot.name;
  resName.style.color = finalLoot.color;
  resourceDisplay.style.display = 'block';
}

function resetUI() {
  isMining = false;
  resourceDisplay.style.display = 'none';
  resourceDisplay.classList.remove('legendary-flicker');
  shatterOverlay.classList.remove('shattered');
  shatterOverlay.classList.add('hidden');
  
  // Rallumage complet des dalles et couches CRT
  terminal.classList.remove('hidden');
  terminal.classList.remove('danger-flicker');
  scanlines.classList.remove('hidden');
  glowLayer.classList.remove('hidden');
  
  mineBtn.disabled = false;
  raritySelect.disabled = false;
  contentDiv.innerHTML = '';
  monitorFrame.className = 'frame';
}

mineBtn.addEventListener('click', startMining);
resetBtn.addEventListener('click', resetUI);
</script>
</body>
</html>
