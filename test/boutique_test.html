<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test API Boutique & Rotations</title>
    <!-- Tailwind CSS pour un style propre rapidement -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-base-200 p-8 font-sans">
    <div class="max-w-2xl mx-auto space-y-8">
        <h1 class="text-2xl font-bold mb-4">Panneau de Test - Boutique</h1>

        <!-- Section 1 : Créer une Boutique / Rotation -->
        <div class="p-6 bg-white rounded-lg shadow border border-gray-200">
            <h2 class="text-lg font-semibold mb-4">1. Créer une Rotation / Boutique (Admin)</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600">Nom</label>
                    <input type="text" id="boutiqueName" value="Boutique Semaine 1" class="w-full border p-2 rounded text-sm">
                </div>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs font-bold uppercase text-gray-600">Début</label>
                        <input type="datetime-local" id="boutiqueStart" class="w-full border p-2 rounded text-sm">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold uppercase text-gray-600">Fin</label>
                        <input type="datetime-local" id="boutiqueEnd" class="w-full border p-2 rounded text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600">Type</label>
                    <input type="text" id="boutiqueType" value="STANDARD" class="w-full border p-2 rounded text-sm">
                </div>
                <button onclick="createBoutique()" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">Créer la Boutique</button>
            </div>
        </div>

        <!-- Section 2 : Sélection Aléatoire de Cosmétiques -->
        <div class="p-6 bg-white rounded-lg shadow border border-gray-200">
            <h2 class="text-lg font-semibold mb-4">2. Sélection Aléatoire de Cosmétiques (Admin)</h2>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs font-bold uppercase text-gray-600">Taille (Size)</label>
                        <input type="number" id="selectSize" value="5" min="1" class="w-full border p-2 rounded text-sm">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold uppercase text-gray-600">Slots Garantis (Slot)</label>
                        <input type="number" id="selectSlot" value="1" min="1" class="w-full border p-2 rounded text-sm">
                    </div>
                </div>
                <button onclick="getRandomCosmetics()" class="w-full bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700">Générer la sélection</button>
            </div>
        </div>

        <!-- Section 3 : Ajouter des cosmétiques à une boutique -->
        <div class="p-6 bg-white rounded-lg shadow border border-gray-200">
            <h2 class="text-lg font-semibold mb-4">3. Ajouter des Cosmétiques à une Boutique (Admin)</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600">ID de la Boutique</label>
                    <input type="number" id="targetBoutiqueId" value="1" min="1" class="w-full border p-2 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600">IDs des Cosmétiques (JSON Array ou séparés par virgule)</label>
                    <input type="text" id="targetCosmeticIds" value='[{"id": 1}, {"id": 2}]' class="w-full border p-2 rounded text-sm font-mono">
                </div>
                <button onclick="addCosmeticsToBoutique()" class="w-full bg-orange-600 text-white p-2 rounded font-bold hover:bg-orange-700">Ajouter à la Boutique</button>
            </div>
        </div>

        <!-- Section 4 : Récupérer la Boutique Active (Utilisateur) -->
        <div class="p-6 bg-white rounded-lg shadow border border-gray-200">
            <h2 class="text-lg font-semibold mb-4">4. Afficher la Boutique Active (Utilisateur)</h2>
            <button onclick="getActiveBoutique()" class="w-full bg-purple-600 text-white p-2 rounded font-bold hover:bg-purple-700">Voir la Boutique Active</button>
        </div>

        <!-- Section des retours / logs -->
        <div class="p-4 bg-gray-900 text-green-400 rounded-lg font-mono text-xs overflow-auto max-h-60">
            <p class="font-bold text-gray-400 mb-1">// Console de réponse :</p>
            <pre id="output">En attente d'une action...</pre>
        </div>
    </div>

    <script>
        function logOutput(data) {
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        }

        async function createBoutique() {
            const name = document.getElementById('boutiqueName').value;
            const start = document.getElementById('boutiqueStart').value;
            const end = document.getElementById('boutiqueEnd').value;
            const type = document.getElementById('boutiqueType').value;

            try {
                const response = await axios.post('http://localhost:9414/api/admin/boutique/rotation/create', {
                    name, start, end, type
                });
                logOutput(response.data);
            } catch (error) {
                logOutput(error.response?.data || error.message);
            }
        }

        async function getRandomCosmetics() {
            const size = document.getElementById('selectSize').value;
            const slot = document.getElementById('selectSlot').value;

            try {
                const response = await axios.get(`http://localhost:9414/api/admin/boutique/cosmetic/random?size=${size}&slot=${slot}`);
                logOutput(response.data);
            } catch (error) {
                logOutput(error.response?.data || error.message);
            }
        }

        async function addCosmeticsToBoutique() {
            const boutiqueId = document.getElementById('targetBoutiqueId').value;
            let rawData = document.getElementById('targetCosmeticIds').value;

            let payload;
            try {
                payload = JSON.parse(rawData);
            } catch (e) {
                logOutput("Erreur : Le format JSON des IDs de cosmétiques est invalide.");
                return;
            }

            try {
                const response = await axios.post(`http://localhost:9414/api/admin/boutique/${boutiqueId}/cosmetic/add`, payload);
                logOutput(response.data);
            } catch (error) {
                logOutput(error.response?.data || error.message);
            }
        }

        async function getActiveBoutique() {
            try {
                const response = await axios.get('http://localhost:9414/api/user/boutique/1');
                logOutput(response.data);
            } catch (error) {
                logOutput(error.response?.data || error.message);
            }
        }
    </script>
</body>
</html>
