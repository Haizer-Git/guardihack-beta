name: GuardiHack Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: TruffleHog — Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          extra_args: --only-verified

  grype-backend-fs:
    name: Grype — Backend Filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Grype scan
        uses: anchore/scan-action@v7
        with:
          path: ./backend
          fail-build: true
          severity-cutoff: high
          output-format: table

  grype-frontend-fs:
    name: Grype — Frontend Filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Grype scan
        uses: anchore/scan-action@v7
        with:
          path: ./frontend
          fail-build: true
          severity-cutoff: high
          output-format: table

  grype-image:
    name: Grype — Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build -t guardihack-backend:ci ./backend

      - name: Grype image scan
        uses: anchore/scan-action@v7
        with:
          image: guardihack-backend:ci
          fail-build: true
          severity-cutoff: high
          output-format: table

  grype-frontend-image:
    name: Grype — Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build frontend image
        run: docker build -t guardihack-frontend:ci ./frontend

      - name: Grype image scan
        uses: anchore/scan-action@v7
        with:
          image: guardihack-frontend:ci
          fail-build: true
          severity-cutoff: high
          output-format: table

  sbom:
    name: Syft — SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate SBOM — Backend
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: cyclonedx-json
          artifact-name: sbom-backend.json

      - name: Generate SBOM — Frontend
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: cyclonedx-json
          artifact-name: sbom-frontend.json
