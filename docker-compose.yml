services:
  backend:
    build: ./backend
    container_name: guardihack-backend
    ports:
      - "9414:9414"
    env_file:
      - .env
    environment:
      - FLASK_APP=main.py
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_SECRET_KEY=${SECRET_KEY}
      - SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI:-sqlite:///guardiahack.db}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - TZ=Europe/Paris
    volumes:
      - ./backend/app:/app
    working_dir: /app
    command: python main.py
    depends_on:
      - redis
      - ssh-tunnel
    networks:
      - guardihack-network

  ssh-tunnel:
    image: alpine:3.20
    container_name: guardihack-ssh-tunnel
    environment:
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}
    command: >
      sh -c "
      apk add --no-cache openssh-client &&
      mkdir -p /root/.ssh &&
      echo \"$$SSH_PRIVATE_KEY\" > /root/.ssh/id_ed25519 &&
      chmod 600 /root/.ssh/id_ed25519 &&
      ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_ed25519 -N -L 0.0.0.0:2375:127.0.0.1:2375 ghtest@141.94.36.242 -p 22223
      "
    networks:
      - guardihack-network

  redis:
    image: redis:7-alpine
    container_name: guardihack-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - guardihack-network

  frontend:
    build: ./frontend
    container_name: guardihack-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0

networks:
  guardihack-network:
    driver: bridge
