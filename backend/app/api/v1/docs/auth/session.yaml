summary: Informations sur la session de l'utilisateur
tags:
  - Session

responses:
  200:
    description: Informations de la session utilisateur.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            session:
              type: array
              description: Informations de la session utilisateur
              properties:
                user_id:
                  type: integer
                  description: ID de l'utilisateur connecté
                  example: 1
                username:
                  type: string
                  description: Nom d'utilisateur de l'utilisateur connecté
                  example: "JohnDoe"
                type:
                  type: string
                  description: Type d'utilisateur
                  enum: [USER, ADMIN]
                  example: "USER"

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [NotFound]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [SESSION_NOT_FOUND]
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Aucune session utilisateur trouvée."