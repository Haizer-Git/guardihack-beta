summary: Demande de réinitialisation du mot de passe via e-mail
tags:
  - Authentification/Reset

requestBody:
  description: Données de demande de réinitialisation de la phrase de passe
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - mail
        properties:
          mail:
            type: string
            description: L'adresse e-mail associée au compte pour lequel la réinitialisation est demandée.
            example: "htiouti@guardiaschool.fr"

responses:
  200:
    description: E-mail de réinitialisation envoyé avec succès.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de confirmation
              example: "Si un compte associé à ce mail existe, un lien a été envoyé."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [BadRequest]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [MAIL_MISSING]
            message:
              type: string
              description: Message d'erreur détaillé
              example: "E-mail manquant."

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [InternalServerError]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [EMAIL_FAILED]
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Erreur lors de l'envoi de l'email de réinitialisation."