summary: Vérification et récupération des informations d'un token d'inscription
tags:
  - Authentification

parameters:
  - name: token
    in: path
    description: Token d'inscription
    required: true
    schema:
      type: string
      example: "M0Wo5OygoQxmXe6LzdhI110pyy7_V_JfyZNPdndydiw"


responses:
  200:
    description: Token d'inscription valide.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            preset:
              type: array
              description: Informations du preset d'utilisateur lié au token d'inscription
              properties:
                mail:
                  type: string
                  description: E-mail associé au token d'inscription
                  example: "htiouti@guardiaschool.fr"
                type:
                  type: string
                  description: Type d'utilisateur associé au token d'inscription
                  enum: 
                    - USER
                    - ADMIN
                  example: "USER"
                first_name:
                  type: string
                  description: Prénom de l'utilisateur associé au token d'inscription
                  example: "John"
                last_name:
                  type: string
                  description: Nom de famille de l'utilisateur associé au token d'inscription
                  example: "Doe"
                affiliation:
                  type: string
                  description: Affiliation de l'utilisateur associé au token d'inscription
                  example: "GuardiHack"
                niveau:
                  type: string
                  description: Niveau de l'utilisateur associé au token d'inscription
                  example: "GCS1"
                classe:
                  type: string
                  description: Classe de l'utilisateur associé au token d'inscription
                  example: "3"

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - TOKEN_EXPIRED
              example: "TOKEN_EXPIRED"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Le token a expiré."
              example: "Le token a expiré."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - TOKEN_INVALID
                - PRESET_NOT_FOUND
              example: "TOKEN_INVALID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Le token fourni n'existe pas ou n'est lié à aucun preset."
              example: "Le token fourni n'existe pas ou n'est lié à aucun preset."
