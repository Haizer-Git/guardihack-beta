summary: Vérification du token de réinitialisation de la phrase de passe
tags:
  - Authentification/Reset

parameters:
  - name: token
    in: path
    description: Token de réinitialisation de la phrase de passe
    required: true
    schema:
      type: string
      example: "M0Wo5OygoQxmXe6LzdhI110pyy7_V_JfyZNPdndydiw"


responses:
  200:
    description: Token de réinitialisation valide.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de confirmation
              example: "Lien de réinitialisation valide."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [NotFound]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [LINK_INVALID]
              example: "LINK_INVALID"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Le lien de réinitialisation est invalide ou a expiré."
