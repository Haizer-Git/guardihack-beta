summary: Connexion à GuardiHack
tags:
  - Authentification

requestBody:
  description: Informations de connexion de l'utilisateur
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          mail:
            type: string
            description: E-mail de l'utilisateur
            example: "htiouti@guardiaschool.fr"
          passphrase:
            type: string
            description: Passphrase de l'utilisateur
            example: "MOT DE PASSE DU COMPTE"


responses:
  200:
    description: Connexion réussie.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de la réponse
              example: "Connexion réussie."
            user:
              type: integer
              description: ID de l'utilisateur connecté
              example: 1
            achievements_processed:
              type: list
              description: Liste des achievements débloqués lors de la connexion, vide si aucun achievement n'a été débloqué
              items:
                type: array
                items:
                  type: object
                  properties:
                    id: 
                      type: integer
                      description: ID du cosmétique ou du badge débloqué
                      example: 1
                    name:
                      type: string
                      description: Nom du cosmétique ou du badge débloqué
                      example: "Badge de connexion"
                    reward_type:
                      type: string
                      description: Type de récompense débloquée
                      enum: [COSMETIC, BADGE]
                      example: "BADGE"
                    icon_url:
                      type: string
                      description: URL de l'icône du cosmétique ou du badge débloqué
                      example: "/static/badges/connexion.png"
                    description:
                      type: string
                      description: Description du cosmétique ou du badge débloqué
                      example: "Badge débloqué pour s'être connecté à GuardiHack."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [BadRequest]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [CREDENTIALS_MISSING]
              example: "CREDENTIALS_MISSING"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "E-mail ou passphrase manquant."

  401:
    description: Données fournies non autorisées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [Unauthorized]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [USER_BANNED, USER_INACTIVE, USER_LOCKED]
              example: "USER_BANNED"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Votre compte fait actuellement l'objet un banissement. Veuillez contacter un administrateur pour plus d'informations."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [NotFound]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [WRONG_CREDENTIALS]
              example: "WRONG_CREDENTIALS"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "E-mail ou passphrase incorrect."

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [InternalServerError]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [PASSPHRASE_VERIFICATION_FAILED]
              example: "PASSPHRASE_VERIFICATION_FAILED"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Erreur lors de la vérification de la passphrase."