summary: Inscription via token de preset
tags:
  - Authentification

requestBody:
  description: Données d'inscription de l'utilisateur
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - username
          - passphrase
          - mail
          - first_name
          - last_name
        properties:
          token:
            type: string
            description: Le token de preset d'inscription fourni dans l'URL.
            example: "M0Wo5OygoQxmXe6LzdhI110pyy7_V_JfyZNPdndydiw"
          username:
            type: string
            description: Le nom d'utilisateur choisi pour le compte.
            example: "Haizer"
          passphrase:
            type: string
            description: La phrase de passe choisie pour le compte.
            example: "MOT DE PASSE DU COMPTE"
          mail:
            type: string
            description: L'adresse e-mail de l'utilisateur (peut être automatiquement rempli par le preset ou ajouté manuellement).
            example: "htiouti@guardiaschool.fr"
          first_name:
            type: string
            description: Le prénom de l'utilisateur (peut être automatiquement rempli par le preset ou ajouté manuellement).
            example: "Haizer"
          last_name:
            type: string
            description: Le nom de famille de l'utilisateur (peut être automatiquement rempli par le preset ou ajouté manuellement).
            example: "Tiouti"
          affiliation:
            type: string
            description: L'affiliation de l'utilisateur (automatiquement pré-remplie depuis le preset, ne peut être modifiée).
            example: "PARIS"
          niveau:
            type: string
            description: Le niveau de l'utilisateur (automatiquement pré-rempli depuis le preset, ne peut être modifié).
            example: "GCS2"
          classe:
            type: string
            description: La classe de l'utilisateur (automatiquement pré-remplie depuis le preset, ne peut être modifiée).
            example: "1"

responses:
  200:
    description: Inscription réussie.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de confirmation
              example: "Inscription réussie. Bienvenue sur GuardiHack !"
            user:
              type: array
              description: Informations de l'utilisateur inscrit
              properties:
                user_id:
                  type: integer
                  description: ID de l'utilisateur inscrit
                  example: 1
                username:
                  type: string
                  description: Nom d'utilisateur de l'utilisateur inscrit
                  example: "Haizer"
                type:
                  type: string
                  description: Type d'utilisateur inscrit
                  enum: 
                    - USER
                    - ADMIN
                  example: "USER"

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USERNAME_MISSING
                - PASSPHRASE_MISSING
                - MAIL_MISSING
                - FIRST_NAME_MISSING
                - LAST_NAME_MISSING
                - TOKEN_MAX_USES
                - TOKEN_EXPIRED
                - USERNAME_LENGTH
                - WEAK_PASSPHRASE
              example: "WEAK_PASSPHRASE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "La phrase doit contenir au moins 14 caractères."
                - "La phrase contient trop de caractères répétés."
                - "La phrase doit contenir plusieurs mots séparés par des espaces."
              example: "La phrase doit contenir au moins 14 caractères."
  
  401:
    description: Données fournies non autorisées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Unauthorized
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USERNAME_BANNED
              example: "USERNAME_BANNED"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Ce nom d'utilisateur n'est pas autorisé."
              example: "Ce nom d'utilisateur n'est pas autorisé."
  
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - TOKEN_INVALID
              example: "TOKEN_INVALID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Le token fourni n'existe pas ou n'est lié à aucun preset."
              example: "Le token fourni n'existe pas ou n'est lié à aucun preset."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USERNAME_TAKEN
                - MAIL_TAKEN
              example: "USERNAME_TAKEN"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Nom d'utilisateur déjà pris."
                - "Adresse e-mail déjà utilisée."
              example: "Nom d'utilisateur déjà pris."

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - HASHING_FAILED
              example: "HASHING_FAILED"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Erreur lors du hachage de la passphrase."
              example: "Erreur lors du hachage de la passphrase."