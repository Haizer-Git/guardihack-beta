summary: Modification de la passphrase via le token de réinitialisation
tags:
  - Authentification/Reset

requestBody:
  description: Données de réinitialisation de la passphrase
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - new_passphrase
        properties:
          token:
            type: string
            description: Le token de réinitialisation fourni dans l'URL.
            example: "M0Wo5OygoQxmXe6LzdhI110pyy7_V_JfyZNPdndydiw"
          new_passphrase:
            type: string
            description: La nouvelle passphrase choisie pour le compte.
            example: "NOUVELLE PASSPHRASE DU COMPTE"


responses:
  200:
    description: Passphrase modifiée avec succès.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de confirmation
              example: "Passphrase réinitialisée avec succès. Redirection vers la page de connexion..."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [BadRequest]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [TOKEN_MISSING, NEW_PASSPHRASE_MISSING, PASSPHRASE_SAME]
              example: "NEW_PASSPHRASE_MISSING"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "La nouvelle passphrase est manquante."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [NotFound]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [LINK_INVALID]
              example: "LINK_INVALID"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Le lien de réinitialisation est invalide ou a expiré."
              
  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: [InternalServerError]
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: [PASSPHRASE_VERIFICATION_FAILED, HASHING_FAILED]
              example: "PASSPHRASE_VERIFICATION_FAILED"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Erreur lors de la vérification de la passphrase."
