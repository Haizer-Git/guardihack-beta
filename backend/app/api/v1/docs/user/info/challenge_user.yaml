summary: Listes des challenges que l'utilisateur cible à validé via son username
tags:
  - User/Info/Challenge

parameters: 
  - name: target_username
    in: path
    type: string
    required: true
    description: Le nom de l'utilisateur cible dont on souhaite récupérer l'historique.
    example: "Haizer"

responses:
  200:
    description: Récupération réussie. Renvoie tous les challenges réussies.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        challenges: 
          type: object
          properties:
            id:
              type: integer
              description: ID du challenge
              example: 1
            name: 
              type: string
              description: Nom du challenge
              example: "OSINT 18"
            category_name:
              type: string
              description: Nom de la catégorie du challenge
              example: "OSINT"
            category_description:
              type: string
              description: Description de la catégorie du challenge
              example: "Challenges liés à l'OSINT"
            difficulty:
              type: string
              description: Difficulté du challenge
              example: "Facile"
            points:
              type: integer
              description: Score du challenge
              example: 150
            submitted_at:
              type: datetime
              description: Date de la validation du challenge
              example: "15/05/2026 14:02:48"

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Utilisateur non trouvé."
              example: "Utilisateur non trouvé."