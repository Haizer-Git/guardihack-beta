summary: Récupération de la liste des utilisateurs inscrits triés avec un type de tri, et le filtre d'affiliation ou de niveau
tags:
  - User - Info
  - List

parameters:
  - name: type
    in: path
    type: string
    required: true
    description: Type de tri pour la liste des utilisateurs.
    enum: [AFFILIATION, NIVEAU, USERNAME]
    example: "AFFILIATION"
  - name: filter
    in: path
    type: string
    required: true
    description: Le filtre choisi pour le type.
    example: "PARIS"
  - name: offset
    in: path
    type: integer
    required: true
    description: Offset pour la pagination de la liste des utilisateurs
    example: 20

responses:
  200:
    description: Récupération réussie. Renvoi la liste de tous les utilisateurs du offset à offset+20.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        user_list:
          type: array
          items:
            properties:
              username:
                type: string
                description: Nom d'utilisateur de l'utilisateur
                example: "Haizer"
              affiliation:
                type: string
                description: Affiliation de l'utilisateur
                example: "PARIS"
              niveau:
                type: string
                description: Niveau de l'utilisateur
                example: "GCS2"
              classe:
                type: string
                description: Classe de l'utilisateur
                example: "1"
              level:
                type: integer
                description: Niveau de l'utilisateur basé sur son XP
                example: 12

  404:
    description: Session utilisateur non trouvée ou type de filtre invalide.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [SESSION_NOT_FOUND, INVALID_TYPE]
          example: "INVALID_TYPE"
        message: 
          type: string
          example: "Type de filtre invalide."