summary: Information sur l'utilisateur connecté
tags:
  - User/Info

responses:
  200:
    description: Récupération réussie. Renvoie les informations de l'utilisateur connecté.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        profile: 
          type: object
          properties:
            username: 
              type: string
              description: Nom d'utilisateur
              example: "Haizer"
            type: 
              type: string
              description: Type de compte de l'utilisateur
              example: "ADMIN"
            global_score:
              type: integer
              description: Score global de l'utilisateur
              example: 1500
            xp:
              type: integer
              description: Points d'expérience de l'utilisateur
              example: 3000
            level:
              type: integer
              description: Niveau de l'utilisateur calculé à partir de l'expérience
              example: 5
            xp_level:
              type: integer
              description: Points d'expérience nécessaires pour atteindre le niveau actuel
              example: 2000
            next_xp_level:
              type: integer
              description: Points d'expérience nécessaires pour atteindre le niveau suivant
              example: 3000
            avatar:
              type: string
              description: URL de l'avatar de l'utilisateur
              example: "./static/avatar/avatar.png"

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Utilisateur non trouvé."
              example: "Utilisateur non trouvé."
