summary: Information du profil personnel d'un utilisateur via son username
tags:
  - User/Info

parameters:
  - name: username
    in: path
    required: true
    description: Nom d'utilisateur de l'utilisateur dont on veut récupérer le profil
    schema:
      type: string

responses:
  200:
    description: Récupération réussie. Renvoie les informations du profil de l'utilisateur.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        profile: 
          type: object
          properties:
            username: 
              type: string
              description: Nom d'utilisateur
              example: "Haizer"
            type: 
              type: string
              description: Type de compte de l'utilisateur
              example: "ADMIN"
            global_score:
              type: integer
              description: Score global de l'utilisateur
              example: 1500
            xp:
              type: integer
              description: Points d'expérience de l'utilisateur
              example: 3000
            level:
              type: integer
              description: Niveau de l'utilisateur calculé à partir de l'expérience
              example: 5
            xp_level:
              type: integer
              description: Points d'expérience nécessaires pour atteindre le niveau actuel
              example: 2000
            next_xp_level:
              type: integer
              description: Points d'expérience nécessaires pour atteindre le niveau suivant
              example: 3000
            connection_streak:
              type: integer
              description: Nombre de connexions consécutives de l'utilisateur (null si le profil est privé)
              example: 10
            first_name: 
              type: string
              description: Prénom de l'utilisateur (null si le profil est privé)
              example: "Haizer"
            last_name: 
              type: string
              description: Nom de famille de l'utilisateur (null si le profil est privé)
              example: "Tiouti"
            affiliation: 
              type: string
              description: Affiliation de l'utilisateur
              example: "PARIS"
            niveau: 
              type: string
              description: Niveau de l'utilisateur
              example: "GCS2"
            classe: 
              type: string
              description: Classe de l'utilisateur
              example: "1"
            avatar:
              type: string
              description: URL de l'avatar de l'utilisateur
              example: "./static/avatar/avatar.png"
            banner:
              type: string
              description: URL de la bannière de l'utilisateur
              example: "./static/banner/banner.png"
            is_private: 
              type: boolean
              description: Indique si le profil de l'utilisateur est privé ou non
              example: False

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Utilisateur non trouvé."
              example: "Utilisateur non trouvé."