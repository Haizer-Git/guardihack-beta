summary: Validation d'un challenge par un utilisateur avec un flag
tags:
  - User/Challenge

parameters:
  - name: challenge_id
    in: path
    type: integer
    required: true
    description: Id du challenge à valider
    example: 2

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          flag:
            type: string
            description: Flag soumis par l'utilisateur pour valider le challenge
            example: "GH{EXAMPLE_FLAG_SUBMISSION}"

responses:
  200:
    description: Challenge validé, renvoi un achievement si l'utilisateur à rempli une nouvelle condition.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        message:
          type: string
          example: "Challenge validé avec succès ! Vous avez gagné {challenges.points} points, ainsi que {xp_change} XP."
        completion_info:
          type: object
          properties:
            challenge_id:
              type: integer
              description: ID du challenge validé
              example: 1
            challenge_name:
              type: string
              description: Nom du challenge validé
              example: "OSINT 19"
            points_awarded:
              type: integer
              description: Points attribués pour la validation du challenge
              example: 450
            xp_awarded:
              type: integer
              description: XP attribués pour la validation du challenge
              example: 150
            category_id:
              type: integer
              description: ID de la catégorie du challenge validé
              example: 1
            level_up:
              type: boolean
              description: Indique si l'utilisateur a gagné un niveau suite à la validation du challenge
              example: true
        achievements_processed:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID du badge ou du cosmétique débloqué
                example: 1
              name:
                type: string
                description: Nom de l'achievement débloqué
                example: "Chapeau de hacker"
              reward_type:
                type: string
                description: Type de récompense débloquée (badge ou cosmétique)
                enum: 
                  - BADGE
                  - COSMETIC
                example: "BADGE"
              icon_url:
                type: string
                description: URL de l'icône représentant l'achievement débloqué
                example: "./static/badge/hacker_hat.png"
              description:
                type: string
                description: Description de l'achievement débloqué
                example: "Félicitations ! Vous avez débloqué le badge 'Chapeau de hacker' pour avoir validé votre premier challenge !"

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_CHALLENGE_ID
              example: "INVALID_CHALLENGE_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID du challenge doit être un entier."
              example: "L'ID du challenge doit être un entier."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_NOT_FOUND
              example: "CHALLENGE_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Challenge non trouvé."
              example: "Challenge non trouvé."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_ALREADY_ACTIVE
              example: "CHALLENGE_ALREADY_ACTIVE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Le challenge est déjà actif."
              example: "Le challenge est déjà actif."
  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_USER_ID
                - USER_NOT_FOUND
                - 
              example: "INVALID_HIDDEN_VALUE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "La valeur de visibilité doit être un booléen."
              example: "La valeur de visibilité doit être un booléen."