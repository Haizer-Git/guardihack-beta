summary: Liste des catégories
description: Permet à un utilisateur de lister toutes les catégories.
tags:
  - User - Catégories

responses:
  200:
    description: Liste des catégories récupérée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            categories:
              type: array
              description: Liste des catégories
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID de la catégorie
                    example: 1
                  name:
                    type: string
                    description: Nom de la catégorie
                    example: "OSINT"
                  description:
                    type: string
                    description: Description de la catégorie
                    example: "Catégorie dédiée aux challenges d'OSINT"

  404:
    description: Session utilisateur non trouvée ou aucune catégorie de challenge trouvée.
    content:
      application/json:    
        schema:
          properties:
            status: 
              type: string
              example: "error"
            slug: 
              type: string
              enum: [SESSION_NOT_FOUND, NO_CATEGORIES]
              example: "NO_CATEGORIES"
            message: 
              type: string
              example: "Aucune catégorie de challenge existante."
