summary: Affichage de la liste de tous les challenges non cachés
tags:
  - User/Challenge

responses:
  200:
    description: Renvoi la liste de tous les challenges non cachés.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        challenges:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID du challenge
                example: 1
              name:
                type: string
                description: Nom du challenge
                example: "OSINT 19"
              category:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Nom de la catégorie du challenge
                      example: "OSINT"
                    description:
                      type: string
                      description: Description de la catégorie du challenge
                      example: "Challenges liés à la recherche d'informations sur Internet"
              difficulty:
                type: string
                description: Difficulté du challenge
                enum: 
                  - EASY
                  - MEDIUM
                  - HARD
                  - EXPERT
                example: "HARD"
              points:
                type: integer
                description: Points attribués pour la résolution du challenge
                example: 450
              is_active:
                type: boolean
                description: Indique si le challenge est actuellement actif
                example: true
              is_validated:
                type: boolean
                description: Indique si le challenge a été validé par l'utilisateur
                example: false
