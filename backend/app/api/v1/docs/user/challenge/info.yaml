summary: Affichage des informations d'un challenge
tags:
  - User/Challenge

parameters:
  - in: path
    name: challenge_id
    required: true
    schema:
      type: integer
    description: ID du challenge à récupérer
    example: 1


responses:
  200:
    description: Renvoi les informations du challenge.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        challenge_info:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID du challenge
                example: 1
              name:
                type: string
                description: Nom du challenge
                example: "OSINT 19"
              type: 
                type: string
                description: Type du challenge
                enum: 
                  - PERMANENT
                  - ROTATION
                  - EVENT
                example: "PERMANENT"
              description:
                type: string
                description: Description du challenge
                example: "Challenge d'OSINT consistant à trouver des informations sur une cible donnée."
              category:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Nom de la catégorie du challenge
                      example: "OSINT"
                    description:
                      type: string
                      description: Description de la catégorie du challenge
                      example: "Challenges liés à la recherche d'informations sur Internet"
              difficulty:
                type: string
                description: Difficulté du challenge
                enum: 
                  - EASY
                  - MEDIUM
                  - HARD
                  - EXPERT
                example: "HARD"
              points:
                type: integer
                description: Points attribués pour la résolution du challenge
                example: 450
              docker_image_id:
                type: integer
                description: ID de l'image Docker du challenge
                example: 1
              is_active:
                type: array ou string
                description: Si le challenge n'est pas permanent, indique la période de disponibilité du challenge
                example: "PERMANENT"
              is_validated:
                type: boolean
                description: Indique si le challenge a été validé par l'utilisateur
                example: false
  
  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_CHALLENGE_ID
              example: "INVALID_CHALLENGE_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID du challenge doit être un entier."
              example: "L'ID du challenge doit être un entier."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_NOT_FOUND
              example: "CHALLENGE_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Challenge non trouvé."
              example: "Challenge non trouvé."
  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_USER_ID
                - USER_NOT_FOUND
              example: "INVALID_USER_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de l'utilisateur doit être un entier."
                - "Utilisateur non trouvé."
              example: "L'ID de l'utilisateur doit être un entier."