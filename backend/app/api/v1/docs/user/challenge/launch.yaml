summary: Lancement d'un challenge par un utilisateur
description: Permet à un utilisateur de lancer un challenge, c'est à dire de créer une instance du challenge pour lui-même.
tags:
  - User/Challenge/Instance

parameters:
  - name: challenge_id
    in: path
    type: integer
    required: true
    description: ID du challenge à lancer
    example: 1


responses:
  200:
    description: Lancement réussie, l'instance Docker du challenge est créée pour l'utilisateur.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        instance_info:
          type: array
          properties:
            url:
              type: string
              description: URL d'accès à l'instance du challenge
              example: "http://challenge-instance-1.guardihack.com"
            expires_at:
              type: datetime
              description: Date et heure d'expiration de l'instance du challenge (1 heure après le lancement)
              example: "2026-12-31 23:59:59"

  400:
    description: Erreur lors du lancement du challenge, utilisateur non trouvé, challenge non trouvé, type de flag invalide pour ce challenge ou erreur lors de la sauvegarfde de l'instance.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [USER_NOT_FOUND, CHALLENGE_NOT_FOUND, INVALID_FLAG_TYPE, INSTANCE_SAVE_ERROR]
          example: "INSTANCE_SAVE_ERROR"
        message: 
          type: string
          example: "Erreur lors de la sauvegarde de l'instance: {str(e)}."


  404:
    description: Session utilisateur non trouvée.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [SESSION_NOT_FOUND]
          example: "SESSION_NOT_FOUND"
        message: 
          type: string
          example: "Session utilisateur non trouvée."