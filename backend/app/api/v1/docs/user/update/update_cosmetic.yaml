summary: Mise à jour de l'avatar de l'utilisateur
tags:
  - User/Update

requestBody:
  description: Nouveau cosmétique à mettre à jour
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - new_cosmetic_id
        properties:
          new_cosmetic_id:
            type: integer
            description: Le nouvel ID du cosmétique que l'utilisateur souhaite adopter.
            example: 10

responses:
  200:
    description: Mise à jour réussie.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        message: 
          type: string
          example: "Le cosmétique {cosmetic.name} a été mis à jour avec succès pour l'utilisateur."

    400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
              - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_COSMETIC_ID
              example: "INVALID_COSMETIC_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID du cosmétique doit être un entier."
              example: "L'ID du cosmétique doit être un entier."

  403:
    description: Accès refusé.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Forbidden
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - COSMETIC_NOT_OWNED
              example: "COSMETIC_NOT_OWNED"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'utilisateur ne possède pas ce cosmétique."
              example: "L'utilisateur ne possède pas ce cosmétique."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - COSMETIC_NOT_FOUND
              example: "COSMETIC_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Cosmétique non trouvé."
              example: "Cosmétique non trouvé."

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_USER_ID
                - USER_NOT_FOUND
                - USER_PROFILE_NOT_FOUND
                - INVALID_COSMETIC_TYPE
              example: "INVALID_COSMETIC_TYPE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de l'utilisateur doit être un entier."
                - "Utilisateur non trouvé."
                - "Profil utilisateur non trouvé."
                - "Type de cosmétique invalide."
              example: "Type de cosmétique invalide."
