summary: Vérfication du code de sécurité pour le changement de mot de passe associé à l'utilisateur
tags:
  - User - Update
  - Password

requestBody:
  description: Code de véfication reçu par mail.
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - code
        properties:
          code:
            type: int
            description: Le code de vérification à 6 chiffres reçu par mail que l'utilisateur doit fournir avant de pouvoir changer son mot de passe.
            example: 123456

responses:
  200:
    description: Code de vérification valide.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        message: 
          type: string
          example: "Code de vérification valide. Vous pouvez maintenant changer votre mot de passe."

  400:
    description: Code de vérification invalide. A noter qu'après 3 tentatives échouées, le compte de l'utilisateur est bloqué permanentement et il doit contacter le support pour le débloquer.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [CODE_EXPIRED, CODE_INVALID, ACCOUNT_LOCKED]
          example: "CODE_INVALID"
        message: 
          type: string
          example: "Le code de vérification est invalide."
  
  404:
    description: Session utilisateur non trouvée.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum : [SESSION_NOT_FOUND]
          example: "SESSION_NOT_FOUND"
        message: 
          type: string
          example: "Session utilisateur non trouvée."

  422:
    description: Code de vérification non fourni dans la requête.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum : [CODE_MISSING]
          example: "CODE_MISSING"
        message: 
          type: string
          example: "Code de vérification manquant."

