summary: Demande d'envoi d'un code de vérification pour le changement de mot de passe
tags:
  - User - Update
  - Password

responses:
  200:
    description: Mail envoyé avec succès sur l'adresse email associée à l'utilisateur.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        message: 
          type: string
          example: "Code de sécurité envoyé par mail."

  400:
    description: Échec lors de l'envoi du mail.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [EMAIL_FAILED]
          example: "EMAIL_FAILED"
        message: 
          type: string
          example: "Échec de l'envoi de l'email. Veuillez réessayer plus tard."
  
  404:
    description: Session utilisateur non trouvée.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum : [SESSION_NOT_FOUND]
          example: "SESSION_NOT_FOUND"
        message: 
          type: string
          example: "Session utilisateur non trouvée."

