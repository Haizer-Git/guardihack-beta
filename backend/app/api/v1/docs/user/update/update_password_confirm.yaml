summary: Modification du mot de passe de l'utilisateur avec le code de vérification reçu par email.
tags:
  - User - Update
  - Password

requestBody:
  description: Le code de vérification reçu par mail ainsi que le nouveau mot de passe de l'utilisateur.
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - code
          - new_password
        properties:
          code:
            type: integer
            description: Le code de vérification à 6 chiffres reçu par email.
            example: 123456
          new_password:
            type: string
            description: Le nouveau mot de passe de l'utilisateur.
            example: "NouveauP@ssw0rd!"

responses:
  200:
    description: Mot de passe mis à jour avec succès.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        message: 
          type: string
          example: "Mot de passe mis à jour avec succès."

  400:
    description: Utilisateur non trouvé, mot de passe ne respectant pas les critères de sécurité, mot de passe inchangé ou code de vérification invalide.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [USER_NOT_FOUND, CODE_EXPIRED, CODE_INVALID, ACCOUNT_LOCKED, PASSWORD_LENGHT, PASSWORD_LOWERCASE, PASSWORD_UPPERCASE, PASSWORD_DIGIT, PASSWORD_SPECIAL, HASHING_FAILED, PASSWORD_UNCHANGED]
          example: "PASSWORD_UNCHANGED"
        message: 
          type: string
          example: "Le nouveau mot de passe est identique à l'ancien."
  
  404:
    description: Session utilisateur non trouvée..
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum : [SESSION_NOT_FOUND]
          example: "SESSION_NOT_FOUND"
        message: 
          type: string
          example: "Session utilisateur non trouvée.."

  422:
    description: Nouveau mot de passe manquant dans la requête.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum : [PASSWORD_MISSING]
          example: "PASSWORD_MISSING"
        message: 
          type: string
          example: "Nouveau mot de passe manquant."

