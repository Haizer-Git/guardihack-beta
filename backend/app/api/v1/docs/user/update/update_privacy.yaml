summary: Mise à jour du mode de confidentialité du profil de l'utilisateur (public/privé)
tags:
  - User - Update
  - Privacy

requestBody:
  description: Nouveau mode de confidentialité à mettre à jour.
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - is_private
        properties:
          new_is_private:
            type: boolean
            description: Le nouveau mode de confidentialité que l'utilisateur souhaite adopter.
            example: true


responses:
  200:
    description: Mise à jour réussie.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        message: 
          type: string
          example: "Mode de confidentialité mis à jour avec succès."

  400:
    description: Profil utilisateur non trouvé ou mode de confidentialité inchangé.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [USER_NOT_FOUND, PRIVACY_UNCHANGED]
          example: "USER_NOT_FOUND"
        message: 
          type: string
          example: "Le nouveau mode de confidentialité est identique à l'ancien."
  
  404:
    description: Session utilisateur non trouvée.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum : [SESSION_NOT_FOUND]
          example: "SESSION_NOT_FOUND"
        message: 
          type: string
          example: "Session utilisateur non trouvée."

  422:
    description: Données manquantes (nouveau mode de confidentialité) ou invalide.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [PRIVACY_SETTING_MISSING, PRIVACY_SETTING_INVALID]
          example: "PRIVACY_SETTING_MISSING"
        message: 
          type: string
          example: "Nouveau mode de confidentialité manquant"
