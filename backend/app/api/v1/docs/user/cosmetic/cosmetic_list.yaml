summary: Liste des cosmétiques d'un utilisateur 
tags:
  - User/Cosmetic

responses:
  200:
    description: Liste des cosmétiques récupérée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            cosmetics:
              type: array
              description: Liste des cosmétiques
              items:
                type: object
                properties:
                  avatar_list:
                    type: array
                    description: Liste des avatars
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type du cosmétique
                          example: "AVATAR"
                        name:
                          type: string
                          description: Nom du cosmétique
                          example: "Avatar GuardiHack Pool 2025"
                        description:
                          type: string
                          description: Description du cosmétique
                          example: "Cet avatar est décerné aux participants de la GuardiHack Pool 2025."
                        icon_url:
                          type: string
                          format: uri
                          description: URL de l'image du cosmétique
                          example: "app/assets/cosmetics/avatar/guardihack_pool.png"
                        requirement_text:
                          type: string
                          description: Description de l'exigence pour obtenir le cosmétique
                          example: "Terminer le défi de la GuardiHack Pool 2025."
                        rarete:
                          type: string
                          description: Rareté du cosmétique
                          example: "RARE"
                        earned_at:
                          type: string
                          format: date-time
                          description: Date d'obtention du cosmétique
                          example: "24/01/2026 14:24:23"
                  banner_list:
                    type: array
                    description: Liste des bannières
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type du cosmétique
                          example: "BANNER"
                        name:
                          type: string
                          description: Nom du cosmétique
                          example: "Bannière GuardiHack Pool 2025"
                        description:
                          type: string
                          description: Description du cosmétique
                          example: "Cette bannière est décernée aux participants de la GuardiHack Pool 2025."
                        icon_url:
                          type: string
                          format: uri
                          description: URL de l'image du cosmétique
                          example: "app/assets/cosmetics/banner/guardihack_pool.png"
                        requirement_type:
                          type: string
                          description: Type de condition pour obtenir le cosmétique
                          example: "CHALLENGE_COMPLETED"
                        requirement_value:
                          type: integer
                          description: Valeur de la condition pour obtenir le cosmétique
                          example: 1
                        rarete:
                          type: string
                          description: Rareté du cosmétique
                          example: "RARE"
                        earned_at:
                          type: string
                          format: date-time
                          description: Date d'obtention du cosmétique
                          example: "24/01/2026 14:24:23"

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Utilisateur non trouvé."
              example: "Utilisateur non trouvé."

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_USER_ID
              example: "INVALID_USER_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de l'utilisateur doit être un entier."
              example: "L'ID de l'utilisateur doit être un entier."
