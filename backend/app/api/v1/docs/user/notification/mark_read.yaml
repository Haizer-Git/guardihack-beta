summary: Marque une notification comme lue pour un utilisateur
tags:
  - User - Notifications

parameters:
  - name: notification_id
    in: path
    type: integer
    required: true
    description: ID de la notification à marquer comme lue
    example: 1
    
responses:
  200:
    description: Notification lue.
    schema:
      properties:
        status: 
          type: string
          example: "success"

  400:
    description: Notification introuvable ou déjà marquée comme lue.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [NOTIFICATION_NOT_FOUND, NOTIFICATION_ALREADY_READ]
          example: "NOTIFICATION_NOT_FOUND"
        message: 
          type: string
          example: Notification introuvable.

  404:
    description: Session utilisateur non trouvée.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [SESSION_NOT_FOUND]
          example: "SESSION_NOT_FOUND"
        message: 
          type: string
          example: Session utilisateur non trouvée.