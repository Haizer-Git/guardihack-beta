summary: Récupération des notifications non lues d'un utilisateur
tags:
  - User - Notifications

responses:
  200:
    description: Récupération réussie. Renvoie les notifications non lues.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        notifications:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID de la notification
                example: 1
              type:
                type: string
                description: Type de la notification.
                enum: [OVERTAKEN, SUPPORT, FRIEND_REQUEST, ACHIEVEMENT_UNLOCKED]
                example: "OVERTAKEN"
              info:
                type: string
                description: Informations supplémentaires liées à la notification.
                example: "Vous avez été dépassé par l'utilisateur Haizer, votre nouveau rang est 5."
              created_at:
                type: string
                format: date-time
                description: Date et heure de création de la notification
                example: "2026-06-01 12:00:00"

  404:
    description: Session utilisateur non trouvée.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [SESSION_NOT_FOUND]
          example: "SESSION_NOT_FOUND"
        message: 
          type: string
          example: Session utilisateur non trouvée.