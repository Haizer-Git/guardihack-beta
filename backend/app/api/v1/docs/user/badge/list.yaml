summary: Liste des badges
tags:
  - User/Badge

responses:
  200:
    description: Liste des badges récupérée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            badges:
              type: array
              description: Liste des badges
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID du badge
                    example: 1
                  type:
                    type: string
                    description: Type du badge
                    example: "ADMIN"
                  name:
                    type: string
                    description: Nom du badge
                    example: "Badge Administrateur"
                  description:
                    type: string
                    description: Description du badge
                    example: "Ce badge est décerné aux administrateurs de GuardiHack."
                  icon_url:
                    type: string
                    format: uri
                    description: URL de l'image du badge
                    example: "app/assets/badges/admin.png"
                  requirement_text:
                    type: string
                    description: Description de l'exigence pour obtenir le badge.
                    example: "Obtenez ce badge en validant 10 challenges de catégorie Web."
                  is_earned:
                    type: string
                    format: date-time
                    description: Date d'obtention du badge si obtenu, sinon None
                    example: "15/04/2026 12:01:25"

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Utilisateur non trouvé."
              example: "Utilisateur non trouvé."
