summary: Récupération de la liste des tous les utilisateurs inscrits par un administrateur
tags:
    - Admin/User

parameters:
  - name: type
    in: path
    type: string
    required: false
    descrption: Type de recherche dans la liste d'utilisateur
    enum:
      - AFFILIATION
      - NIVEAU
      - USERNAME
    example: "USERNAME"

  - name: filter
    in: path
    type: string
    required: false
    description: Filtre appliqué selon le type de recherche
    example: "Haizer"

  - name: offset
    in: path
    type: integer
    required: true
    description: Offset pour la pagination de la liste des utilisateurs
    example: 20


responses:
  200:
    description: Récupération réussie. Renvoi la liste de tous les utilisateurs du offset à offset+20.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        users:
          type: array
          items:
            properties:
              id:
                type: integer
                description: ID de l'utilisateur
                example: 1
              username:
                type: string
                description: Nom d'utilisateur de l'utilisateur
                example: "Haizer"
              mail:
                type: string
                description: Adresse email de l'utilisateur
                example: "htiouti@guardiaschool.fr"
              type:
                type: string
                description: Type de l'utilisateur (USER, ADMIN, EXTERNE)
                example: "USER"
              status:
                type: string
                description: Statut de l'utilisateur (ACTIVE, INACTIVE)
                example: "ACTIVE"
              affiliation:
                type: string
                description: Affiliation de l'utilisateur
                example: "PARIS"
              niveau:
                type: string
                description: Niveau de l'utilisateur
                example: "GCS2"
              classe:
                type: string
                description: Classe de l'utilisateur
                example: "1"
              xp:
                type: integer
                description: XP de l'utilisateur
                example: 1200
              level:
                type: integer
                description: Niveau de l'utilisateur basé sur son XP
                example: 12
              global_score:
                type: integer
                description: Score global de l'utilisateur basé sur son XP et ses badges
                example: 1500
              guardicoin:
                type: integer
                description: Nombre de guardicoins de l'utilisateur
                example: 200
        total_users:
          type: integer
          description: Nombre total d'utilisateurs
          example: 45

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_FILTER_TYPE
              example: "INVALID_FILTER_TYPE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Type de filtre invalide."
              example: "Type de filtre invalide."
