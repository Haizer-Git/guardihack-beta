summary: Information d'un token
tags:
  - Admin/Token

parameters: 
  - name: token_id
    in: path
    type: integer
    required: true
    description: ID du token à récupérer.
    example: 1

responses:
  200:
    description: Informations du token récupérées avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            presets:
              type: array
              items:
                type: object
                description: Liste des tokens récupérés.
                properties:
                  id:
                    type: integer
                  preset_id:
                    type: integer
                    description: ID du preset utilisateur associé au token
                    example: 1
                  token:
                    type: string
                    description: Valeur du token d'accès
                    example: "abc123def456ghi789jkl012mno345pq"
                  uses:
                    type: integer
                    description: Nombre d'utilisations du token
                    example: 5
                  max_uses:
                    type: integer
                    description: Nombre maximum d'utilisations du token
                    example: 10
                  expires_at:
                    type: string
                    format: date-time
                    description: Date et heure d'expiration du token
                    example: "2026-05-20 21:38:54.833939"
                  created_by:
                    type: string
                    description: Nom d'utilisateur de l'administrateur ayant créé le token
                    example: "admin_user"
                  created_at:
                    type: string
                    format: date-time
                    description: Date et heure de création du token
                    example: 15/06/2026 14:30:00

  400:
      description: Requête invalide.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Statut de l'erreur
                enum: 
                  - BadRequest
                example: "error"
              slug:
                type: string
                description: Code d'erreur spécifique
                enum: 
                - INVALID_TOKEN_ID
                example: "INVALID_TOKEN_ID"
              message:
                type: string
                description: Message d'erreur détaillé
                enum: 
                  - "L'ID du token doit être un entier."
                example: "L'ID du token doit être un entier."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - TOKEN_NOT_FOUND
              example: "TOKEN_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Le token spécifié n'existe pas."
              example: "Le token spécifié n'existe pas."

