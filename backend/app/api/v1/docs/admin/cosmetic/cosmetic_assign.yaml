summary: Assignation d'un cosmétique à un utilisateur
tags:
  - Admin/Cosmetic

parameters:
  - in: path
    name: cosmetic_id
    description: ID du cosmétique à assigner
    required: true
    schema:
      type: integer
      example: 1

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - user_id
        properties:
          user_id:
            type: integer
            description: ID de l'utilisateur à qui assigner le cosmétique
            example: 123

responses:
  200:
    description: Cosmétique assigné avec succès à l'utilisateur.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: f"Le cosmétique {cosmetic.name} a été attribué à l'utilisateur {user.username} avec succès."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_USER_ID
              - INVALID_COSMETIC_ID
              example: "INVALID_COSMETIC_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de l'utilisateur doit être un entier."
                - "L'ID du cosmétique doit être un entier."
              example: "L'ID du cosmétique doit être un entier."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
                - COSMETIC_NOT_FOUND
              example: "COSMETIC_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Cosmétique non trouvé."
              example: "Cosmétique non trouvé."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - COSMETIC_ALREADY_OWNED
              example: "COSMETIC_ALREADY_OWNED"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'utilisateur possède déjà ce cosmétique."
              example: "L'utilisateur possède déjà ce cosmétique."

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_ASSIGN_VALUE
              example: "INVALID_ASSIGN_VALUE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "La valeur d'assignation doit être un booléen."
              example: "La valeur d'assignation doit être un booléen."
