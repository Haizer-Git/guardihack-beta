summary: Création d'un cosmétique par un administrateur
tags:
  - Admin/Cosmetic

requestBody:
  description: Données du cosmétique à créer
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - description
          - type
          - requirement_type
          - requirement_value
          - requirement_text
          - rarete
          - exclu
        properties:
          name:
            type: string
            description: Le nom du cosmétique à créer.
            example: "Avatar GuardiHack 2026"
          description:
            type: string
            description: La description du cosmétique à créer.
            example: "Avatar attribué aux participants de GuardiHack 2026."
          type:
            type: string
            description: Le type du cosmétique à créer.
            enum:
              - AVATAR
              - BANNER
            example: "AVATAR"
          requirement_type:
            type: string
            description: Le type d'exigence pour obtenir le cosmétique.
            enum: 
              - CHALLENGE_ID
              - SOLVE_COUNT
              - SCORE
              - CATEGORY_SOLVE_COUNT
              - CONNECTION_STREAK
              - CONNECTION_DATE
            example: "CHALLENGE_ID"
          requirement_value:
            type: integer
            description: La valeur requise pour obtenir le cosmétique.
            example: 6
          requirement_text:
            type: string
            description: Description de l'exigence pour obtenir le cosmétique.
            example: "Avatar decerné aux participants de GuardiHack 2026."
          rarete:
            type: string
            description: La rareté du cosmétique.
            enum:
              - COMMUN
              - RARE
              - EPIC
              - LEGENDARY
            example: "RARE"
          exclu:
            type: boolean
            description: Indique si le cosmétique peut être acheté dans la boutique.
            example: true


responses:
  201:
    description: Cosmétique créé avec succès.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de confirmation
              example: f"Le cosmétique {name} a été créé avec succès."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - MISSING_FIELD
                - INVALID_COSMETIC_DATA
                - INVALID_REQUIREMENT_VALUE
                - INVALID_EXCLU_VALUE
                - INVALID_REQUIREMENT_TYPE
                - INVALID_COSMETIC_TYPE
                - INVALID_RARETE
              example: "INVALID_RARETE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Le champ '{field}' est requis pour créer un cosmétique."
                - "Les informations du cosmétique doivent être sous forme de dictionnaire."
                - "La valeur de l'exigence doit être un entier."
                - "La valeur de l'exclusivité doit être un booléen."
                - "Type d'exigence invalide."
                - "Type de cosmétique invalide."
                - "Rareté invalide."
              example: "Rareté invalide."
  
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "L'utilisateur créant le cosmétique n'existe pas."
              example: "L'utilisateur créant le cosmétique n'existe pas."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - COSMETIC_ALREADY_EXISTS
              example: "COSMETIC_ALREADY_EXISTS"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Un cosmétique avec ce nom existe déjà."
              example: "Un cosmétique avec ce nom existe déjà."

  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_USER_ID
              example: "INVALID_USER_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "L'ID de l'utilisateur doit être un entier."
              example: "L'ID de l'utilisateur doit être un entier."