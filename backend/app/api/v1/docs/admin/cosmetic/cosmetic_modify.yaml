summary: Modification d'un cosmétique par un administrateur
tags:
  - Admin/Cosmetic

parameters:
  - name: cosmetic_id
    in: path
    description: ID du cosmétique à modifier
    required: true
    schema:
      type: integer
      example: 1


requestBody:
  description: Données du cosmétique à modifier
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          new_name:
            type: string
            description: Le nouveau nom du cosmétique (vide = gardera son nom actuel).
            example: "Avatar GuardiHack 2026"
          new_description:
            type: string
            description: La nouvelle description du cosmétique (vide = gardera sa description actuelle).
            example: "Avatar attribué aux participants de GuardiHack 2026."
          new_type:
            type: string
            description: Le nouveau type du cosmétique (vide = gardera son type actuel).
            enum:
              - AVATAR
              - BANNER
            example: "AVATAR"
          new_requirement_type:
            type: string
            description: Le nouveau type d'exigence pour obtenir le cosmétique (vide = gardera son type d'exigence actuel).
            enum: 
              - CHALLENGE_ID
              - SOLVE_COUNT
              - SCORE
              - CATEGORY_SOLVE_COUNT
              - CONNECTION_STREAK
              - CONNECTION_DATE
            example: "CHALLENGE_ID"
          new_requirement_value:
            type: integer
            description: La nouvelle valeur requise pour obtenir le cosmétique (vide = gardera sa valeur actuelle).
            example: 6
          new_requirement_text:
            type: string
            description: La nouvelle description de l'exigence pour obtenir le cosmétique (vide = gardera son texte d'exigence actuel).
            example: "Avatar decerné aux participants de GuardiHack 2026."
          new_rarete:
            type: string
            description: La nouvelle rareté du cosmétique (vide = gardera sa rareté actuelle).
            enum:
              - COMMUN
              - RARE
              - EPIC
              - LEGENDARY
            example: "RARE"
          new_exclu:
            type: boolean
            description: Indique si le cosmétique peut être acheté dans la boutique (vide = gardera sa valeur actuelle).
            example: true


responses:
  201:
    description: Cosmétique modifié avec succès.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de confirmation
              example: f"Le cosmétique {cosmetic.name} a été modifié avec succès."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_COSMETIC_ID
                - INVALID_COSMETIC_DATA
                - INVALID_REQUIREMENT_VALUE
                - INVALID_EXCLU_VALUE
                - INVALID_REQUIREMENT_TYPE
                - INVALID_COSMETIC_TYPE
                - INVALID_RARETE
                - NO_MODIFICATIONS
              example: "INVALID_RARETE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID du cosmétique doit être un entier."
                - "Les informations du cosmétique doivent être sous forme de dictionnaire."
                - "La valeur de l'exigence doit être un entier."
                - "La valeur de l'exclusivité doit être un booléen."
                - "Type d'exigence invalide."
                - "Type de cosmétique invalide."
                - "Rareté invalide."
                - "Aucune modification n'a été apportée au cosmétique."
              example: "Rareté invalide."
  
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - COSMETIC_NOT_FOUND
              example: "COSMETIC_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Cosmétique non trouvé."
              example: "Cosmétique non trouvé."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - COSMETIC_ALREADY_EXISTS
              example: "COSMETIC_ALREADY_EXISTS"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Un cosmétique avec ce nom existe déjà."
              example: "Un cosmétique avec ce nom existe déjà."
