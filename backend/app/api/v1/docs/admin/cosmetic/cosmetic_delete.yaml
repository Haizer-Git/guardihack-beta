summary: Suppression d'un cosmétique par un administrateur
tags:
  - Admin/Cosmetic

parameters:
  - in: path
    name: cosmetic_id
    required: true
    schema:
      type: integer
      description: ID du cosmétique à supprimer
      example: 1

responses:
  200:
    description: Cosmétique supprimé avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Le cosmétique {cosmetic.name} a été supprimé avec succès."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
              - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_COSMETIC_ID
              example: "INVALID_COSMETIC_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID du cosmétique doit être un entier."
              example: "L'ID du cosmétique doit être un entier."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - COSMETIC_NOT_FOUND
              example: "COSMETIC_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              example: "Cosmétique non trouvé."