summary: Affichage de la liste de tous les challenges par un administrateur
tags:
  - Admin/Challenge


responses:
  200:
    description: Renvoi la liste de tous les challenges.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        challenges:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID du challenge
                example: 1
              name:
                type: string
                description: Nom du challenge
                example: "OSINT 19"
              type:
                type: string
                description: Type du challenge
                enum:
                  - PERMANENT
                  - ROTATION
                example: "PERMANENT"
              category_name:
                type: string
                description: Nom de la catégorie du challenge
                example: "OSINT"
              difficulty:
                type: string
                description: Difficulté du challenge
                enum: 
                  - EASY
                  - MEDIUM
                  - HARD
                  - EXPERT
                example: "HARD"
              points:
                type: integer
                description: Points attribués pour la résolution du challenge
                example: 450
              hidden:
                type: boolean
                description: Indique si le challenge est caché ou non
                example: false
              rotations:
                type: array
                description: Liste des rotations où se trouve le challenge
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: ID de la rotation
                      example: 1
              submissions_count:
                type: integer
                description: Nombre total de soumissions valides
                example: 5
              created_at:
                type: string
                description: Date de création du challenge
                example: "14/05/2026 14:01:14"
              created_by:
                type: string
                description: Nom d'utilisateur de l'administrateur ayant créé le challenge
                example: "Haizer"