summary: Affichage des informations d'un challenge par un administrateur
tags:
  - Admin/Challenge

parameters:
  - in: path
    name: challenge_id
    required: true
    schema:
      type: integer
    description: ID du challenge à récupérer
    example: 1

responses:
  200:
    description: Renvoi les informations du challenge.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        challenge_info:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID du challenge
                example: 1
              name:
                type: string
                description: Nom du challenge
                example: "OSINT 19"
              type: 
                type: string
                description: Type du challenge
                enum: 
                  - PERMANENT
                  - ROTATION
                example: "PERMANENT"
              description:
                type: string
                description: Description du challenge
                example: "Challenge d'OSINT consistant à trouver des informations sur une cible donnée."
              category_name:
                type: string
                description: Nom de la catégorie du challenge
                example: "OSINT"
              category_description:
                type: string
                description: Description de la catégorie du challenge
                example: "Challenges liés à la recherche d'informations sur Internet"
              difficulty:
                type: string
                description: Difficulté du challenge
                enum: 
                  - EASY
                  - MEDIUM
                  - HARD
                  - EXPERT
                example: "HARD"
              points:
                type: integer
                description: Points attribués pour la résolution du challenge
                example: 450
              docker_image_id:
                type: integer
                description: ID de l'image Docker du challenge
                example: 1
              hidden:
                type: boolean
                description: Indique si le challenge est caché ou non
                example: false
              is_active:
                type: boolean
                description: Indique si le challenge est actuellement actif
                example: true
              active_rotation_id:
                type: integer
                description: ID de la rotation active du challenge (si applicable)
                example: 2
              rotations:
                type: array
                description: Liste des rotations du challenge (si applicable)
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: ID de la rotation
                      example: 2
                    name:
                      type: string
                      description: Nom de la rotation
                      example: "Rotation 1"
                    start_date:
                      type: string
                      format: date-time
                      description: Date de début de la rotation
                      example: "2026-01-01 00:00:00"
                    end_date:
                      type: string
                      format: date-time
                      description: Date de fin de la rotation
                      example: "2026-01-31 23:59:59"
              history:
                type: array
                description: Historique des résolutions du challenge par les utilisateurs
                items:
                  type: object
                  properties:
                    username:
                      type: string
                      description: Nom d'utilisateur de l'utilisateur ayant validé le challenge
                      example: "Haizer"
                    submitted_at:
                      type: string
                      format: date-time
                      description: Date et heure de la résolution du challenge par l'utilisateur
                      example: "2026-12-31 23:59:59"


  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_CHALLENGE_ID
              example: "INVALID_CHALLENGE_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID du challenge doit être un entier."
              example: "L'ID du challenge doit être un entier."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_NOT_FOUND
              example: "CHALLENGE_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Challenge non trouvé."
              example: "Challenge non trouvé."