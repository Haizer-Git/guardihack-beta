summary: Affichage du flag d'un challenge en tant qu'Administrateur
tags:
  - Admin/Challenges/Flag

parameters:
  - in: path
    name: challenge_id
    required: true
    schema:
      type: integer
    description: ID du challenge à récupérer
    example: 1


responses:
  200:
    description: Renvoi le flag du challenge.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        flag:
          type: string
          description: Flag du challenge
          example: "GH{example_flag}"

  404:
    description: Session utilisateur non trouvée, challenge non trouvé ou erreur lors de la récupération du flag.
    schema:
      properties:
        status: 
          type: string
          example: "error"
        slug: 
          type: string
          enum: [SESSION_NOT_FOUND, CHALLENGE_NOT_FOUND, DECRYPTION_FAILED]
          example: "DECRYPTION_FAILED"
        message: 
          type: string
          example: "Échec du déchiffrement du flag : {str(e)}"