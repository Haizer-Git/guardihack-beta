summary: Création d'un challenge par un administrateur
tags:
  - Admin/Challenge

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - type
          - description
          - category_id
          - difficulty
          - points
          - docker_image_id
          - flag_type
          - master_flag
        properties:
          name:
            type: string
            description: Nom du challenge
            example: "OSINT 18"
          type:
            type: string
            description: Type du challenge
            enum:
              - PERMANENT
              - ROTATION
            example: "PERMANENT"
          description:
            type: string
            description: Description du challenge
            example: "Découvrez les secrets hihihihi"
          category_id:
            type: integer
            description: ID de la catégorie du challenge
            example: 1
          difficulty:
            type: string
            description: Difficulté du challenge
            enum:
              - EASY
              - MEDIUM
              - HARD
              - EXPERT
            example: "HARD"
          points:
            type: integer
            description: Points attribués pour la résolution du challenge
            example: 450
          docker_image_id:
            type: integer
            description: ID de l'image Docker associée au challenge
            example: 1
          flag_type:
            type: string
            description: Type de flag
            enum: 
              - STATIC
              - DYNAMIC
            example: "STATIC"
          master_flag:
            type: string
            description: Flag maître du challenge
            example: "GH{EXAMPLE_MASTER_FLAG}"

responses:
  201:
    description: Challenge crée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Challenge créé avec succès."
  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_DATA
              - MISSING_FIELD
              - INVALID_CATEGORY_ID
              - INVALID_DIFFICULTY
              - INVALID_TYPE
              - INVALID_FLAG_TYPE
              - INVALID_POINTS
              - INVALID_DOCKER_IMAGE_ID
              example: "INVALID_CATEGORY_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Les données doivent être un dictionnaire."
                - "Le champ 'name' est requis."
                - "Le champ 'description' est requis."
                - "Le champ 'category_id' est requis."
                - "Le champ 'difficulty' est requis."
                - "Le champ 'points' est requis."
                - "Le champ 'docker_image_id' est requis."
                - "Le champ 'flag_type' est requis."
                - "Le champ 'master_flag' est requis."
                - "L'ID de la catégorie doit être un entier."
                - "Difficulté de challenge invalide."
                - "Type de flag invalide."
                - "Le nombre de points doit être un entier."
                - "L'ID de l'image Docker doit être un entier."
              example: "L'ID de la catégorie doit être un entier."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CATEGORY_NOT_FOUND
              example: "CATEGORY_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Catégorie de challenge non trouvée."
              example: "Catégorie de challenge non trouvée."
  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_ALREADY_EXISTS
              example: "CHALLENGE_ALREADY_EXISTS"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Un challenge avec ce nom existe déjà."
              example: "Un challenge avec ce nom existe déjà."
  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Utilisateur non trouvé."
              example: "Utilisateur non trouvé."