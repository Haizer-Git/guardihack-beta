summary: Activation d'un challenge par un administrateur
tags:
  - Admin/Challenge

parameters:
  - in: path
    name: challenge_id
    required: true
    schema:
      type: integer
    description: ID du challenge à activer
    example: 1

responses:
  200:
    description: Challenge rendu visible avec succès avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Le challenge est maintenant visible."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_CHALLENGE_ID
              example: "INVALID_CHALLENGE_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID du challenge doit être un entier."
              example: "L'ID du challenge doit être un entier."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_NOT_FOUND
              example: "CHALLENGE_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Challenge non trouvé."
              example: "Challenge non trouvé."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_ALREADY_ACTIVE
              example: "CHALLENGE_ALREADY_ACTIVE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Le challenge est déjà actif."
              example: "Le challenge est déjà actif."
  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_HIDDEN_VALUE
              example: "INVALID_HIDDEN_VALUE"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "La valeur de visibilité doit être un booléen."
              example: "La valeur de visibilité doit être un booléen."