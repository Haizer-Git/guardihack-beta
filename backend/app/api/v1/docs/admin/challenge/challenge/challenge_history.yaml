summary: Affichage de l'historique de soumission de validation d'un challenge
tags:
  - Admin/Challenge

parameters:
  - in: path
    name: challenge_id
    required: true
    schema:
      type: integer
    description: ID du challenge à récupérer
    example: 1

  - in: path
    name: offset
    required: true
    schema:
      type: integer
    description: Nombre de soumissions à sauter pour la pagination
    example: 0

responses:
  200:
    description: Renvoi l'historique de soumission de validation d'un challenge.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        history:
          type: array
          items:
            type: object
            properties:
              submission_id:
                type: integer
                description: ID de la soumission de validation
                example: 1
              user_id:
                type: integer
                description: ID de l'utilisateur ayant soumis la validation
                example: 42
              username:
                type: string
                description: Nom d'utilisateur de la personne ayant soumis la validation
                example: "Haizer"
              is_correct:
                type: boolean
                description: Indique si la soumission de validation est correcte ou non
                example: true
              flag_submitted:
                type: string
                description: Flag soumis par l'utilisateur lors de la validation
                example: "GH{EXAMPLE}"
              flag_type:
                type: string
                description: Type de flag soumis (NULL en cas de soumission fausse)
                enum:
                  - MASTER
                  - DYNAMIC
                  - NULL
                example: "DYNAMIC"
              submitted_at:
                type: string
                format: date-time
                description: Date et heure de la soumission de validation
                example: "2026-08-01 12:00:00"
        total_submissions:
          type: integer
          description: Nombre total de soumissions de validation pour le challenge
          example: 100
  
  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_CHALLENGE_ID
              - INVALID_OFFSET
              example: "INVALID_OFFSET"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'offset doit être un entier positif."
              example: "L'offset doit être un entier positif."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_NOT_FOUND
              example: "CHALLENGE_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Challenge non trouvé."
              example: "Challenge non trouvé."
  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_LIMIT
              example: "INVALID_LIMIT"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "La limite doit être un entier positif."
              example: "La limite doit être un entier positif."