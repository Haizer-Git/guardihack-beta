summary: Liste des catégories
tags:
  - Admin/Category

responses:
  200:
    description: Liste des catégories récupérée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            categories:
              type: array
              description: Liste des catégories
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID de la catégorie
                    example: 1
                  name:
                    type: string
                    description: Nom de la catégorie
                    example: "OSINT"
                  description:
                    type: string
                    description: Description de la catégorie
                    example: "Catégorie dédiée aux challenges d'OSINT"
                  challenge_count:
                    type: integer
                    description: Nombre de challenges dans la catégorie
                    example: 5