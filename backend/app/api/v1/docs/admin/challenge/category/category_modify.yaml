summary: Modification d'une catégorie de challenge
tags:
  - Admin/Category

parameters:
  - in: path
    name: category_id
    required: true
    schema:
      type: integer
    description: ID de la catégorie à modifier
    example: 1

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          new_category_name:
            type: string
            description: Nouveau nom de la catégorie (vide = gardera son nom actuel)
            example: "OSINT"
          new_category_description:
            type: string
            description: Nouvelle description de la catégorie (vide = gardera sa description actuelle)
            example: "Catégorie dédiée aux challenges d'OSINT"


responses:
  201:
    description: Catégorie modifiée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Catégorie de challenge modifiée avec succès."
  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
              - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_CATEGORY_ID
                - NO_MODIFICATIONS
              example: "NO_MODIFICATIONS"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de la catégorie doit être un entier."
                - "Aucune modification n'a été apportée à la catégorie."
              example: "Aucune modification n'a été apportée à la catégorie."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CATEGORY_NOT_FOUND
              example: "CATEGORY_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Catégorie non trouvée."
              example: "Catégorie non trouvée."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CATEGORY_ALREADY_EXISTS
              example: "CATEGORY_ALREADY_EXISTS"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Une catégorie de challenge avec ce nom existe déjà."
              example: "Une catégorie de challenge avec ce nom existe déjà."