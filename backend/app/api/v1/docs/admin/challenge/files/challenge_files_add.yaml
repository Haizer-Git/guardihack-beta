summary: Ajout d'un fichier à un challenge
description: Permet à un administrateur d'ajouter un fichier à un challenge.
tags:
  - Admin/Challenge/Files

parameters:
  - in: path
    name: challenge_id
    required: true
    schema:
      type: integer
    description: ID du challenge auquel le fichier doit être ajouté


requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          file:
            type: string
            format: binary
            description: Fichier à ajouter
          file_type:
            type: string
            description: Type du fichier (e.g., "attachment", "writeup", etc.)
            example: "attachment"
          file_name:
            type: string
            description: Nom personnalisé pour le fichier (optionnel)
            example: "fichier_challenge.txt"

responses:
  201:
    description: Fichier de challenge ajouté avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Fichier de challenge ajouté avec succès."
            file_name:
              type: string
              description: Nom du fichier ajouté
              example: "fichier_challenge.txt"

  400:
    description: Données manquantes, aucun fichier envoyé, type de fichier manquant ou fichier vide.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            slug:
              type: string
              enum: [MISSING_FILE, MISSING_FILE_TYPE, EMPTY_FILE]
              example: "MISSING_FILE"
            message:
              type: string
              example: "Aucun fichier envoyé."

  404:
    description: Session utilisateur non trouvée.
    content:
      application/json:    
        schema:
          properties:
            status: 
              type: string
              example: "error"
            slug: 
              type: string
              enum: [SESSION_NOT_FOUND]
              example: "SESSION_NOT_FOUND"
            message: 
              type: string
              example: "Session utilisateur non trouvée."

  500:
    description: Erreur lors de l'enregistrement du fichier, le nom du fichier est déjà pris.
    content:
      application/json:    
        schema:
          properties:
            status: 
              type: string
              example: "error"
            slug: 
              type: string
              enum: [FILENAME_TAKEN]
              example: "FILENAME_TAKEN"
            message: 
              type: string
              example: "Le nom du fichier est déjà pris."