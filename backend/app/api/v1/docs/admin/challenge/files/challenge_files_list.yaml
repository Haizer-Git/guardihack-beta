summary: Affichage de la liste des fichiers d'un challenge
description: Permet à un administrateur d'afficher la liste des fichiers associés à un challenge
tags:
  - Admin/Challenge/Files

parameters:
  - in: path
    name: challenge_id
    required: true
    schema:
      type: integer
    description: ID du challenge pour lequel afficher les fichiers liés

responses:
  200:
    description: Liste des fichiers de challenge affichée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            files:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID du fichier
                    example: 1
                  file_type:
                    type: string
                    description: Type du fichier
                    example: "txt"
                  file_name:
                    type: string
                    description: Nom du fichier
                    example: "fichier_challenge.txt"
                  file_url:
                    type: string
                    description: URL pour accéder au fichier
                    example: "backend/app/static/challenge_files/fichier_challenge.txt"
                  file_role:
                    type: string
                    description: Rôle du fichier (e.g., "attachment", "writeup", etc.)
                    example: "attachment"
                  sha256:
                    type: string
                    description: Hash SHA-256 du fichier
                    example: "3a7bd3e2360a3d80e355d9cbb1b1b8f2c"
                  uploaded_at:
                    type: datetime
                    description: Date et heure de l'upload du fichier
                    example: "2024-01-01 12:00:00"

  404:
    description: Session utilisateur non trouvée ou challenge non trouvé.
    content:
      application/json:    
        schema:
          properties:
            status: 
              type: string
              example: "error"
            slug: 
              type: string
              enum: [SESSION_NOT_FOUND, CHALLENGE_NOT_FOUND]
              example: "CHALLENGE_NOT_FOUND"
            message: 
              type: string
              example: "Challenge non trouvé."
