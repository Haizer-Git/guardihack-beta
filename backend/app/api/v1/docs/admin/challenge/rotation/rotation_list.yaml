summary: Affichage de la liste de toutes les rotations de challenges
tags:
  - Admin/Rotation

responses:
  200:
    description: Renvoi la liste de toutes les rotations.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        rotations:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                descrption: ID de la rotation
                example: 1
              name:
                type: string
                description: Nom de la rotation
                example: "Rotation Juillet 2026"
              start_time:
                type: string
                format: date-time
                description: Date de début de la rotation
                example : "14/07/2026 14:02:23"
              end_time:
                type: string
                format: date-time
                descrption: Date de fin de la rotation
                example: "14/08/2026 14:02:23"
              challenge_count:
                type: integer
                description: Nombre de challenge présent dans la rotation
                example: 15
