summary: Affichage des informations d'une rotation via son ID
tags:
  - Admin/Rotation

parameters:
  - in: path
    name: rotation_id
    required: true
    schema:
      type: integer
    description: ID de la rotation a afficher
    example: 1

responses:
  200:
    description: Renvoi les infos de la rotation.
    schema:
      properties:
        status: 
          type: string
          example: "success"
        rotation:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID de la rotation
                example: 1
              name:
                type: string
                description: Nom de la rotation
                example: "Rotation de Juillet 2027"
              start_time:
                type: string
                format: date-time
                description: Date de début de la rotation
                example : "14/07/2026 14:02:23"
              end_time:
                type: string
                format: date-time
                descrption: Date de fin de la rotation
                example: "14/08/2026 14:02:23"
              challenges:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: ID du challenge
                      example: 1
                    name:
                      type: string
                      description: Nom du challenge
                      example: "Osint 17"
                    type:
                      type: string
                      description: Type du challenge
                      enum:
                        - PERMANENT
                        - ROTATION
                      example: "PERMANENT"
                    description:
                      type: string
                      description: Description du challenge
                      example: "Retrouvez cette personne"
                    category_name:
                      type: string
                      description: Nom de la catégorie de la catégorie du challenge
                      example: "OSINT"
                    category_description:
                      type: string
                      description: Description de la catégorie du challenge
                    difficulty:
                      type: string
                      description: Difficulté du challenge
                      enum:
                        - EASY
                        - MEDIUM
                        - HARD
                        - EXPERT
                      example: "EASY"
                    points:
                      type: integer
                      description: Points attribués pour la résolution du challenge
                      example: 450
                    hidden:
                      type: boolean
                      description: Indique si le challenge est caché ou non
                      example: false
                    created_at:
                      type: string
                      format: date-time
                      description: Date de création du challenge
                    created_by:
                      type: string
                      description: Nom d'utilisateur de l'administrateur ayant créé le challenge
                      example: "Haizer"


  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_ROTATION_ID
              example: "INVALID_ROTATION_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de la rotation doit être un entier."
              example: "L'ID de la rotation doit être un entier."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - ROTATION_NOT_FOUND
              example: "ROTATION_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Rotation non trouvée."
              example: "Rotation non trouvée."