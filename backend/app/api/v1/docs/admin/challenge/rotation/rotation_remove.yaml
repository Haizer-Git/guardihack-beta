summary: Retrait d'un challenge à une rotation par un administrateur
tags:
  - Admin/Rotation

parameters:
  - in: path
    name: rotation_id
    required: true
    schema:
      type: integer
    description: ID de la rotation à laquelle retirer les challenges
    example: 1

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          challenge_id:
            type: array
            items:
              type: integer
            description: Liste des ID des challenges à retirer à la rotation
            example: [1, 2, 3]

responses:
  201:
    description: Challenge(s) retiré(s) à la rotation avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Challenge(s) retiré(s) à la rotation avec succès."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
              - INVALID_ROTATION_ID
              - INVALID_CHALLENGE_DATA
              - EMPTY_CHALLENGE_LIST
              - INVALID_CHALLENGE_ID
              example: "EMPTY_CHALLENGE_LIST"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de la rotation doit être un entier."
                - "La liste des challenges doit être un tableau."
                - "La liste des challenges est vide."
                - "L'ID du challenge doit être un entier."
              example: "La liste des challenges est vide."
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - ROTATION_NOT_FOUND
                - CHALLENGE_NOT_FOUND
              example: "ROTATION_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Rotation non trouvée."
                - "Challenge ID {challenge_id} non trouvé"
              example: "Rotation non trouvée."
  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - CHALLENGE_NEVER_ADDED
              example: "CHALLENGE_NEVER_ADDED"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Aucun challenge retiré de la rotation, aucun des challenges spécifiés n'était présent dans la rotation."
              example: "Aucun challenge retiré de la rotation, aucun des challenges spécifiés n'était présent dans la rotation."