summary: Suppression d'une rotation de challenges
tags:
  - Admin/Rotation

parameters:
  - in: path
    name: rotation_id
    required: true
    schema:
      type: integer
    description: ID de la rotation à supprimer
    example: 1

responses:
  200:
    description: Rotation supprimée avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Rotation supprimée avec succès."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - ROTATION_NOT_FOUND
              example: "ROTATION_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Rotation non trouvée."
              example: "Rotation non trouvée."