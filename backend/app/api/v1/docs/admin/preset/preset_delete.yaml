summary: Suppression d'un preset utilisateur par un administrateur
tags:
  - Admin/Preset

parameters: 
  - name: preset_id
    in: path
    type: integer
    required: true
    description: ID du preset utilisateur à supprimer.
    example: 1


responses:
  200:
    description: Preset supprimé avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: "Preset supprimé avec succès."

  400:
      description: Requête invalide.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Statut de l'erreur
                enum: 
                  - BadRequest
                example: "error"
              slug:
                type: string
                description: Code d'erreur spécifique
                enum: 
                - INVALID_PRESET_ID
                example: "INVALID_PRESET_ID"
              message:
                type: string
                description: Message d'erreur détaillé
                enum: 
                  - "L'ID du preset doit être un entier."
                example: "L'ID du preset doit être un entier."
  
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - PRESET_NOT_FOUND
              example: "PRESET_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Le preset spécifié n'existe pas."
              example: "Le preset spécifié n'existe pas."
