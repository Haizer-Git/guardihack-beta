summary: Information d'un preset utilisateur
tags:
  - Admin/Preset

parameters: 
  - name: preset_id
    in: path
    type: integer
    required: true
    description: ID du preset utilisateur à récupérer.
    example: 1

responses:
  200:
    description: Informations du preset utilisateur récupérées avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            badges:
              type: array
              description: Information du preset utilisalateur
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID du preset
                    example: 1
                  mail:
                    type: string
                    description: Email associé au preset
                    example: "htiouti@guardiaschool.fr"
                  type:
                    type: string
                    description: Type du preset
                    enum: 
                      - ADMIN
                      - USER
                      - PEDAGOGIE
                      - INVITE
                      - EXTERNE
                    example: "USER"
                  first_name:
                    type: string
                    description: Prénom associé au preset
                    example: "Jean"
                  last_name:
                    type: string
                    description: Nom associé au preset
                    example: "Dupont"
                  affiliation:
                    type: string
                    description: Affiliation associée au preset
                    example: "LYON"
                  niveau:
                    type: string
                    description: Niveau associé au preset
                    example: "GCS3"
                  classe:
                    type: string
                    description: Classe associée au preset
                    example: "3"
                  created_by:
                    type: string
                    description: Nom d'utilisateur de l'administrateur ayant créé le preset
                    example: "admin_user"

  400:
      description: Requête invalide.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Statut de l'erreur
                enum: 
                  - BadRequest
                example: "error"
              slug:
                type: string
                description: Code d'erreur spécifique
                enum: 
                - INVALID_PRESET_ID
                example: "INVALID_PRESET_ID"
              message:
                type: string
                description: Message d'erreur détaillé
                enum: 
                  - "L'ID du preset doit être un entier."
                example: "L'ID du preset doit être un entier."
  
  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - PRESET_NOT_FOUND
              example: "PRESET_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "Le preset spécifié n'existe pas."
              example: "Le preset spécifié n'existe pas."

