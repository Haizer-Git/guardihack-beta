summary: Création d'un preset utilisateur par un administrateur
tags:
  - Admin/Preset

requestBody:
  description: Données du preset utilisateur à créer
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - mail
          - type
          - affiliation
          - niveau
          - classe
        properties:
          mail:
            type: string
            description: L'adresse e-mail de l'utilisateur (facultatif).
            example: "htiouti@guardiaschool.fr"
          type:
            type: string
            description: Le type d'utilisateur à créer.
            enum: 
              - ADMIN
              - USER
              - PEDAGOGIE
              - INVITE
              - EXTERNE
            example: "USER"
          first_name:
            type: string
            description: Le prénom de l'utilisateur (facultatif).
            example: "Haizer"
          last_name:
            type: string
            description: Le nom de famille de l'utilisateur (facultatif).
            example: "Tiouti"
          affiliation:
            type: string
            description: L'affiliation de l'utilisateur.
            example: "PARIS"
          niveau:
            type: string
            description: Le niveau de l'utilisateur.
            example: "GCS2"
          classe:
            type: string
            description: La classe de l'utilisateur.
            example: "1"

responses:
  200:
    description: Preset créé avec succès.
    content:
      application/json:
        schema:
          properties:
            status:
              type: string
              description: Statut de la réponse
              example: "success"
            message:
              type: string
              description: Message de confirmation
              example: "Preset créé avec succès."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - BadRequest
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - MISSING_TYPE
                - MISSING_AFFILIATION
                - MISSING_NIVEAU
                - MISSING_CLASSE
                - INVALID_DATA
                - INVALID_PRESET_TYPE
                - INVALID_MAIL
              example: "INVALID_DATA"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - f"Le champ 'type' est requis."
                - f"Le champ 'affiliation' est requis."
                - f"Le champ 'niveau' est requis."
                - f"Le champ 'classe' est requis."
                - "Les données doivent être un dictionnaire."
                - "Le type de preset spécifié n'est pas autorisé."
                - "L'adresse e-mail spécifiée n'est pas valide."
              example: "Les données doivent être un dictionnaire."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - NotFound
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message:
              type: string
              description: Message d'erreur détaillé
              enum:
                - "L'utilisateur créant le preset n'existe pas."
              example: "L'utilisateur créant le preset n'existe pas."

  409:
    description: Données fournies présentant un ou plusieurs conflits.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - Conflict
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - DUPLICATE_MAIL
              example: "DUPLICATE_MAIL"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "Un preset avec cette adresse e-mail existe déjà."
              example: "Un preset avec cette adresse e-mail existe déjà."


  500:
    description: Erreur interne du serveur.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Statut de l'erreur
              enum: 
                - InternalServerError
              example: "error"
            slug:
              type: string
              description: Code d'erreur spécifique
              enum: 
                - INVALID_USER_ID
              example: "INVALID_USER_ID"
            message:
              type: string
              description: Message d'erreur détaillé
              enum: 
                - "L'ID de l'utilisateur doit être un entier."
              example: "L'ID de l'utilisateur doit être un entier."