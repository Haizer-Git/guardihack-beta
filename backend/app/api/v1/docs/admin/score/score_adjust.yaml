summary: Modification du score d'un utilisateur par un administrateur
tags:
  - Admin/Score

requestBody:
  description: Données pour ajuster le score d'un utilisateur
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - user_id
          - amount
        properties:
          user_id:
            type: integer
            description: ID de l'utilisateur à qui modifier le montant d'expérience
            example: 123
          amount:
            type: integer
            description: Le montant de score à ajouter (positif) ou retirer (négatif) de l'utilisateur
            example: 150
          history:
            type: boolean
            description: Indique si l'ajustement du score doit être enregistré dans l'historique des changements de score (facultatif)
            example: true
          reason:
            type: string
            description: Raison de l'ajustement du score si history = True (facultatif)
            example: "Correction manuelle du score"


responses:
  200:
    description: Score de l'utilisateur modifié avec succès.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "success"
            message:
              type: string
              example: f"Score ajusté manuellement de {score_change} points avec succès."

  400:
    description: Requête invalide.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              enum:
                - BadRequest
              example: "error"
            slug:
              type: string
              enum:
                - INVALID_USER_ID
                - INVALID_SCORE_CHANGE
                - MISSING_REASON
                - INVALID_HISTORY_FLAG
              example: "MISSING_REASON"
            message:
              type: string
              enum:
                - "L'ID de l'utilisateur doit être un entier."
                - "Le changement de score doit être un entier."
                - "Une raison doit être fournie pour l'historique du score."
                - "Le paramètre 'history' doit être un booléen."
              example: "Une raison doit être fournie pour l'historique du score."

  404:
    description: Données fournies non trouvées.
    content:
      application/json:    
        schema:
          properties:
            status: 
              type: string
              enum:
                - NotFound
              example: "error"
            slug: 
              type: string
              enum: 
                - USER_NOT_FOUND
              example: "USER_NOT_FOUND"
            message: 
              type: string
              enum:
                - "L'utilisateur spécifié n'existe pas."
              example: "L'utilisateur spécifié n'existe pas."
